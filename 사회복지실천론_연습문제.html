<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사회복지실천론 기말고사 자료</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#e6dfcf; --card:#f8f3e6; --ink:#2f2a23; --sub:#6b6457; --line:#dcd2bd;
  --accent:#2f5fd0; --accent-soft:#e8e0ca;
  --ok:#1f8a4c; --ok-bg:#e5f5ec; --ok-line:#7cc79b;
  --bad:#c93232; --bad-bg:#fdeaea; --bad-line:#e69a9a;
  --bar:#ddd4c0; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#12161c; --card:#1b212a; --ink:#e7ebf1; --sub:#9aa5b5; --line:#2e3744;
  --accent:#7fa2f0; --accent-soft:#222c40;
  --ok:#5fd08d; --ok-bg:#16301f; --ok-line:#2f7a4b;
  --bad:#ff7b7b; --bad-bg:#3a1c1e; --bad-line:#8a3a3d;
  --bar:#2a3340; --shadow:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#12161c; --card:#1b212a; --ink:#e7ebf1; --sub:#9aa5b5; --line:#2e3744;
  --accent:#7fa2f0; --accent-soft:#222c40;
  --ok:#5fd08d; --ok-bg:#16301f; --ok-line:#2f7a4b;
  --bad:#ff7b7b; --bad-bg:#3a1c1e; --bad-line:#8a3a3d;
  --bar:#2a3340; --shadow:none;
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding-block:0 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 상단 고정 바 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 10px;border-bottom:1px solid var(--line)}
.top-inner{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;min-width:0}
.stat .k{font-size:12px;color:var(--sub);line-height:1.3}
.stat .v{font-size:19px;font-weight:700;line-height:1.3;white-space:nowrap}
.stat .v small{font-size:12px;font-weight:500;color:var(--sub);margin-left:2px}
.bar{height:6px;background:var(--bar);border-radius:99px;margin-top:4px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tools{display:flex;align-items:center;gap:6px;flex:none}
.mini{display:none;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.top.folded .stats,.top.folded .btns{display:none}
.top.folded .title-row{margin-bottom:0}
.top.folded .mini{display:inline}
html.folded{scroll-padding-top:70px}
@media (max-width:560px){.top.folded .mini{font-size:12px}.top.folded h1{font-size:15px}}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1420}
.btn.icon{padding:6px 10px}

/* 목차 */
.toc{margin:18px 0 6px}
.toc h2{font-size:15px;color:var(--sub);margin:0 0 8px;font-weight:600}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.chip{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:6px 8px;text-align:center;font-size:14px;font-weight:600;line-height:1.35}
.chip span{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.chip.done{border-color:var(--ok-line);background:var(--ok-bg)}
.chip.hasbad{border-color:var(--bad-line)}
.chip.hasbad span{color:var(--bad)}
.chip:hover{border-color:var(--accent)}

/* 강의 섹션 */
.lec{margin-top:28px}
.lec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:12px}
.lec-head h2{margin:0;font-size:21px;color:var(--accent);min-width:0;text-wrap:balance}
.lec-head h2 small{font-size:16px;font-weight:600;color:var(--ink);margin-left:6px}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lec-head .meta{font-size:13px;color:var(--sub);white-space:nowrap}

/* 문제 카드 */
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.q.solved{border-color:var(--ok-line)}
.passage{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:16px}
.passage{white-space:pre-line}
.passage b{display:block;font-size:12px;color:var(--accent);margin-bottom:2px;letter-spacing:.04em}
.qtext{font-weight:700;margin:0 0 10px}
.qno{display:inline-block;background:var(--accent);color:#fff;border-radius:7px;padding:0 8px;margin-right:8px;font-size:14px}
:root[data-theme="dark"] .qno{color:#0e1420}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;background:var(--card);color:var(--ink);
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;line-height:1.55}
.opt .n{flex:none;font-weight:700;color:var(--sub);min-width:1.3em}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.bad .n{color:var(--bad)}
.opt.bad:hover{background:var(--bad-bg);border-color:var(--bad)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.ok .n{color:var(--ok)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
.fb{margin:10px 0 0;font-weight:700;font-size:15px;min-height:0}
.fb.bad{color:var(--bad)} .fb.ok{color:var(--ok)}
.exp{margin:8px 0 0;background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:10px;padding:10px 12px;font-size:16px}
.exp b{color:var(--ok)}
.hidden{display:none}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:.95}

.result{margin-top:28px;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:16px;text-align:center}
.result h3{margin:0 0 6px;font-size:19px}

@media (max-width:560px){
  body{font-size:16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat .v{font-size:17px}
  html{scroll-padding-top:200px}
  h1{font-size:17px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="title-row">
      <h1>사회복지실천론 기말고사 자료</h1>
      <div class="tools">
        <span class="mini" id="mini"></span>
        <button class="btn icon" id="foldBtn" aria-expanded="true" title="점수판 접기">▲ 접기</button>
        <button class="btn icon" id="themeBtn" aria-label="다크모드 전환" title="다크모드 전환">🌙 다크</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">진행률</div><div class="v"><span id="stProg">0/0</span><small id="stProgPct">0%</small></div><div class="bar"><i id="bar"></i></div></div>
      <div class="stat"><div class="k">점수 (100점 환산)</div><div class="v"><span id="stScore">0</span><small>점</small></div></div>
      <div class="stat"><div class="k">정답률 (푼 문제 기준)</div><div class="v"><span id="stRate">-</span></div></div>
      <div class="stat"><div class="k">첫 선택 정답 / 오답</div><div class="v"><span id="stOk" style="color:var(--ok)">0</span> / <span id="stBad" style="color:var(--bad)">0</span></div></div>
    </div>
    <div class="btns">
      <button class="btn primary" id="retryWrong">오답만 다시풀기</button>
      <button class="btn" id="retryAll">전체 다시풀기</button>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="toc" aria-label="강의 목차">
    <h2>강의 목차</h2>
    <div class="chips" id="chips"></div>
  </nav>
  <div id="lectures"></div>
  <div id="result" class="result hidden"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA = [{"n": 1, "t": "사회복지실천이란 무엇인가", "qs": [{"no": 1, "text": "사회복지(social welfare)와 사회복지실천(social work practice)에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["사회복지는 한 개인의 노력으로 충분히 실현될 수 있는 활동이다.", "사회복지는 사회구성원의 안녕을 위한 제도·정책·서비스를 포괄하는 개념이다.", "사회복지실천은 사회복지의 이념을 현장에서 구체적으로 풀어내는 활동이다.", "과거 한국에서는 종교적·자선적 동기를 중심으로 '사회사업'이라는 용어가 통용되었다."], "ans": 0, "exp": "사회복지는 개인의 노력이 아니라 집합적이고 조직적인 활동을 통해 이루어진다. ②③④는 모두 옳은 설명이다."}, {"no": 2, "text": "전미사회복지사협회(NASW)가 설명한 사회복지실천의 내용으로 가장 적절한 것은?", "passage": null, "plabel": "지문", "opts": ["개인의 심리치료에만 한정되는 임상 활동이다.", "개인·집단·지역사회의 사회적 기능을 증진하고 회복시키는 전문적 활동이다.", "사회복지기관의 행정 효율만을 높이는 활동이다.", "빈곤층에게 물질적 급여를 제공하는 공공부조 활동만을 뜻한다."], "ans": 1, "exp": "NASW의 정의는 개인·집단·지역사회의 사회적 기능을 증진하고 회복시키는 전문적 활동으로 제시된다. 사회복지실천은 심리치료·기관행정·공공부조 중 하나에만 한정되지 않는다."}, {"no": 3, "text": "사회복지실천의 목적에 관한 설명으로 가장 옳은 것은?", "passage": null, "plabel": "지문", "opts": ["빈곤층에 한정하여 물질적 자원을 분배하는 것이다.", "모든 사람의 삶의 질 향상을 위해 개인과 사회 사이의 유익한 상호작용을 촉진하거나 회복하는 것이다.", "개인의 심리적 문제를 치료하는 임상적 활동에 한정된다.", "사회복지사의 전문성을 높이는 것이 일차적 목적이다."], "ans": 1, "exp": "사회복지실천의 목적은 개인의 문제해결 능력 향상, 필요한 자원의 획득, 사람과 자원체계의 상호작용 촉진, 전달체계의 개선, 정책과 환경에 대한 영향 등을 포함한다. 따라서 개인과 사회의 유익한 상호작용을 촉진하고 삶의 질을 높인다는 ②가 가장 적절하다."}, {"no": 4, "text": "사회복지실천의 개입체계 수준에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["미시 수준은 개인이나 가족을 대상으로 한 직접적 개입이다.", "중시 수준은 집단이나 조직을 대상으로 한 개입을 포함한다.", "거시 수준은 지역사회·정책·제도 차원의 변화를 추구한다.", "미시·중시·거시 수준은 서로 분리되어 독립적으로 작동하며 통합될 수 없다."], "ans": 3, "exp": "미시·중시·거시 수준은 분리된 영역이 아니라 하나의 흐름으로 연결되어 있으며, 사회복지실천은 이 세 수준을 통합적으로 다루는 것을 지향한다."}, {"no": 5, "text": "사회복지실천 관점의 역사적 변화에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["자발적 자선에서 공공의 책임으로 변화해왔다.", "빈민에 대한 시혜에서 모든 사회구성원의 권리로 변화해왔다.", "거시적 접근에서 미시적·임상적 접근으로 점차 축소되어 왔다.", "문제의 원인을 개인의 도덕적 결함에서 찾는 관점에서 사회구조적 요인에서 찾는 관점으로 변화해왔다."], "ans": 2, "exp": "사회복지실천은 오히려 개인 차원의 자선에서 시작해 사회구조와 제도 차원으로 그 영역이 확장되어 왔다. 미시적 접근으로 축소되어 온 것이 아니라, 미시에서 거시까지 함께 다루는 통합적 방향으로 발전해왔다."}, {"no": 6, "text": "사회복지에 관한 설명으로 포함되지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["특정 계층을 대상으로 개인이 베푸는 자선 활동에 한정된다.", "사회구성원 모두의 안녕한 삶을 지향한다.", "사회적 욕구의 충족과 사회문제의 예방·치료를 목적으로 한다.", "제도와 서비스의 총체로 구현되는 조직적 사회 노력이다."], "ans": 0, "exp": "사회복지를 사회구성원 모두의 안녕을 지향하고, 사회적 욕구 충족과 사회문제의 예방·치료를 목적으로 하며, 제도와 서비스로 구현되는 조직적 사회 노력으로 정리한다. 개인의 자선 활동에 한정된다는 ①은 이에 어긋난다."}, {"no": 7, "text": "사회복지실천의 정의와 그 정의를 제시한 주체가 잘못 짝지어진 것은?", "passage": null, "plabel": "지문", "opts": ["Richmond(1922) — 개인과 사회환경의 관계를 의식적으로 조정해 개인의 인격발달을 이루는 과정", "전미사회복지사협회(NASW) — 개인·집단·지역사회의 사회적 기능을 증진하고 회복시키는 전문적 활동", "국제사회복지사연맹(IFSW) — 사회 내 장벽·불공정·부정에 관여하는 활동", "Friedlander와 Apte — 사회복지를 개인의 심리치료에 한정된 활동으로 정의"], "ans": 3, "exp": "Friedlander와 Apte는 사회복지를 사회적 욕구 충족에 필요한 입법·프로그램·혜택과 같은 서비스를 포함하는 사회적 제도로 설명한다. 개인의 심리치료에 한정했다는 ④는 잘못된 연결이다."}, {"no": 8, "text": "사회복지실천의 목적에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["사람들의 문제해결 능력과 대처 능력을 높이도록 돕는다.", "사람들이 필요한 자원을 획득하도록 돕는다.", "사람과 자원·서비스·기회 제공 체계의 상호작용을 촉진한다.", "사회복지사의 전문적 권위와 사회적 지위를 높이는 일을 최우선으로 한다."], "ans": 3, "exp": "문제해결 능력의 향상, 필요한 자원의 획득, 사람과 자원체계의 상호작용 촉진 등을 사회복지실천의 목적으로 제시한다. 사회복지사의 권위와 지위 향상을 최우선 목적으로 삼지는 않는다."}, {"no": 9, "text": "사회복지실천의 대상과 영역을 '개입체계 수준'에 따라 범주화한 것은?", "passage": null, "plabel": "지문", "opts": ["빈곤·비행·범죄", "아동·청소년·여성·노인", "미시·중시·거시", "아동복지·노인복지·정신건강"], "ans": 2, "exp": "사회복지실천을 미시·메조·매크로 수준을 통합하는 일반주의 실천으로 설명한다. 따라서 개입체계 수준을 나타내는 ③이 정답이다."}]}, {"n": 2, "t": "사회복지실천을 떠받치는 이론들", "qs": [{"no": 10, "text": "생태체계 관점에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["일반체계이론과 생태학적 관점이 결합된 틀이다.", "인간을 환경과 분리된 존재로 보고 개인 내부의 문제에 집중한다.", "A와 B 사이의 시간을 두고 지속되는 순환적 교환에 주목한다.", "미시·중시·거시 수준의 환경을 함께 고려한다."], "ans": 1, "exp": "생태체계 관점은 인간을 환경과 분리된 존재가 아니라 환경 속의 인간(person-in-environment)으로 보며, 개인 내부의 문제에만 집중하는 것이 아니라 개인과 환경 사이의 상호작용에 주목한다."}, {"no": 11, "text": "강점 관점(strengths perspective)의 원리에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["클라이언트의 문제와 병리를 정확히 진단하는 것이 출발점이다.", "모든 개인·가족·집단·지역사회는 강점을 가지고 있다.", "위기와 어려움도 도전과 기회가 될 수 있다.", "변화와 성장의 가능성은 무한하다."], "ans": 0, "exp": "강점 관점은 문제·병리·결함 중심의 진단에서 벗어나, 클라이언트의 강점·자원·잠재력에 초점을 두는 관점이다. 문제와 병리의 정확한 진단을 출발점으로 삼는 것은 오히려 문제중심 접근에 가깝다."}, {"no": 12, "text": "역량강화(임파워먼트) 관점에 관한 설명으로 옳은 것을 모두 고른 것은?", "passage": "ㄱ. 개인 수준에서는 자존감과 자기효능감의 향상과 관련된다.\nㄴ. 집단 수준에서는 상호협력과 사회행동의 발달과 관련된다.\nㄷ. 지역사회 수준에서는 사회정책과 제도의 변화와 연관된다.\nㄹ. 비판적 의식화(critical consciousness)의 과정을 포함한다.", "plabel": "보기", "opts": ["ㄱ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "ans": 3, "exp": "역량강화 관점은 개인·집단·지역사회 세 수준 모두에서 작동하며, 비판적 의식화를 통해 클라이언트가 자신이 처한 억압구조를 이해하고 변화시키도록 돕는 과정을 포함한다."}, {"no": 13, "text": "비판적 사회복지론과 반억압 실천(anti-oppressive practice)에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["빈곤과 불평등을 개인의 도덕적 결함이 아니라 사회구조의 문제로 본다.", "사회복지사 자신이 무의식적으로 재생산할 수 있는 권력관계를 성찰한다.", "사회복지사의 정치적 중립성을 가장 중요한 원칙으로 삼는다.", "전문가의 권위와 제도의 게이트키핑 기능을 비판적으로 살핀다."], "ans": 2, "exp": "비판적 사회복지론은 사회복지 자체가 권력관계 속에서 작동한다고 보기 때문에, '정치적 중립'을 핵심 원칙으로 내세우지 않는다. 오히려 누구의 이익을 대변하는 실천인가를 명시적으로 묻는다."}, {"no": 14, "text": "다음은 한 사례에 여러 관점을 적용한 것이다. 각 관점과 그 적용이 가장 적절하게 짝지어진 것은?", "passage": "50대 여성 A씨는 남편의 폭력으로 이혼한 후 우울증으로 사회복지관에 의뢰되었다. 그는 두 자녀를 홀로 양육하며 비정규직 일자리를 전전해왔다.", "plabel": "사례", "opts": ["생태체계 관점 — A씨의 우울증 약물 처방에 집중한다.", "강점 관점 — A씨의 두 자녀 양육 경험과 일자리를 유지해 온 끈기를 자원으로 본다.", "역량강화 관점 — A씨에게 정해진 프로그램을 그대로 따르도록 요구한다.", "비판적 사회복지론 — A씨의 가정폭력은 전적으로 A씨의 선택 문제로 해석한다."], "ans": 1, "exp": "① 생태체계 관점은 약물 처방이 아니라 A씨를 둘러싼 가족·이웃·고용 환경 등 전체 체계를 살피는 데 초점을 둔다. ③ 역량강화 관점은 정해진 프로그램을 따르게 하는 것이 아니라, A씨가 자신의 삶에 대한 결정권을 회복하도록 돕는다. ④ 비판적 사회복지론은 가정폭력을 개인의 선택이 아닌 성별 권력관계와 사회구조의 문제로 본다. 강점 관점은 A씨의 양육 경험과 끈기를 변화의 자원으로 본다."}, {"no": 15, "text": "단선적 사고와 생태체계 사고의 차이에 관한 설명으로 가장 옳은 것은?", "passage": null, "plabel": "지문", "opts": ["생태체계 사고는 \"A가 B에 영향을 준다\"는 일방향의 인과관계에 주목한다", "생태체계 사고는 A와 B가 시간을 두고 서로 영향을 주고받는 순환적 교환에 주목한다", "단선적 사고는 인간을 환경 속의 인간(person-in-environment)으로 본다", "두 사고는 본질적으로 같으므로 실천에서 구분할 필요가 없다"], "ans": 1, "exp": "단선적 사고가 \"A가 B에 영향을 준다\"를 살핀다면, 생태체계 사고는 \"A와 B가 시간을 두고 서로 영향을 주고받는다\"는 순환적 교환에 주목한다. 환경 속의 인간 개념은 생태체계 관점의 핵심이다."}, {"no": 16, "text": "비판적 사회복지론이 페미니즘을 이론적 자원으로 활용하는 이유로 가장 적절한 것은?", "passage": null, "plabel": "지문", "opts": ["성별·돌봄·가족·노동을 둘러싼 권력관계와 구조적 불평등을 분석할 수 있기 때문이다.", "여성 클라이언트에게만 적용되는 상담 절차를 제공하기 때문이다.", "개인의 심리적 결함을 진단하는 표준검사를 제공하기 때문이다.", "생태체계 관점과 강점 관점을 배제할 수 있기 때문이다."], "ans": 0, "exp": "페미니즘을 비판적 사회복지론의 이론적 자원으로 제시한다. 페미니즘은 성별·돌봄·가족·노동을 둘러싼 권력관계와 구조적 불평등을 드러내는 데 기여한다."}, {"no": 17, "text": "사회복지실천 관점의 통합에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["생태체계 관점은 개인과 환경의 상호작용을 함께 살핀다.", "강점 관점과 역량강화 관점은 클라이언트의 강점·자원·통제력 회복에 주목한다.", "비판적 사회복지론은 문제가 반복되는 구조와 권력관계를 묻는다.", "통합이란 여러 관점을 임의로 섞는 것이므로 사례에 따른 의식적 선택은 필요하지 않다."], "ans": 3, "exp": "생태체계·강점·역량강화·비판적 사회복지의 네 관점을 비교한다. 관점의 통합은 임의적 혼합이 아니라 사례의 문제, 목표, 윤리적 쟁점에 따라 적절한 관점을 의식적으로 선택하고 결합하는 일이다."}]}, {"n": 3, "t": "사회복지사의 정체성과 역할", "qs": [{"no": 18, "text": "다음 중 Hepworth가 제시한 사회복지사의 업무 특성에 따른 다섯 가지 역할에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["직접서비스 제공", "체계 연결", "체계 유지와 강화", "클라이언트 평가와 진단"], "ans": 3, "exp": "Hepworth가 제시한 다섯 가지 역할은 ① 직접서비스 제공 ② 체계 연결 ③ 연구와 조사 ④ 체계 유지와 강화 ⑤ 체계 개발이다. \"클라이언트 평가와 진단\"은 별도의 분류 항목으로 포함되지 않는다."}, {"no": 19, "text": "다음에 제시된 사회복지사의 역할 중 거시(매크로) 수준의 역할에 해당하는 것을 모두 고른 것은?", "passage": "ㄱ. 행동가(activist)\nㄴ. 계획가(planner)\nㄷ. 조력자(enabler)\nㄹ. 현장 활동가(outreach worker)\nㅁ. 사회변화대행자(change agent)", "plabel": "보기", "opts": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㅁ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ, ㅁ"], "ans": 3, "exp": "행동가, 계획가, 현장활동가, 사회변화대행자는 모두 거시 수준의 역할이다. 조력자(enabler)는 개인과 가족을 대상으로 하는 미시 수준의 역할이다."}, {"no": 20, "text": "다음 사례에서 사회복지사가 수행한 역할로 가장 적절한 것은?", "passage": "여러 기관의 서비스를 이용하는 클라이언트에게 사회복지사가 욕구를 사정하고 서비스 계획을 세운 뒤, 자원을 연계하고 제공 과정을 계속 점검하였다.", "plabel": "사례", "opts": ["임상가(clinician)", "사례관리자(case manager)", "조직가(organizer)", "평가자·연구자(evaluator/researcher)"], "ans": 1, "exp": "사례관리자는 다중 욕구를 가진 클라이언트의 상황을 사정하고, 계획을 세우며, 필요한 자원과 서비스를 연계·조정하고 진행 과정을 점검한다."}, {"no": 21, "text": "한국의 사회복지사와 사회복지전담공무원에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["사회복지전담공무원 제도는 1987년부터 시작되었다.", "한국의 사회복지사는 공적부조 업무에만 한정되며 민간 영역에서는 활동하지 않는다.", "사회복지전담공무원은 국민기초생활보장 업무, 아동·노인·장애인 복지업무 등을 담당한다.", "한국의 사회복지는 자선·구빈에서 시작해 운동성과 전문성이 함께 발전해왔다."], "ans": 1, "exp": "한국의 사회복지사는 공적부조 영역의 사회복지전담공무원뿐 아니라 종합사회복지관, 노인·장애인·아동·여성 복지기관, 학교·의료·정신보건·교정 등 다양한 민간 영역에서 활동한다."}, {"no": 22, "text": "다음 사례에서 사회복지사가 수행한 역할로 가장 적절한 것은?", "passage": "사회복지사는 한부모가족을 대상으로 자녀의 발달 단계, 긍정적 의사소통, 위기 상황 대처 방법을 익히는 부모교육 프로그램을 운영하였다.", "plabel": "사례", "opts": ["교육자(educator)", "중재자(mediator)", "평가자(evaluator)", "정책기획자(policy planner)"], "ans": 0, "exp": "교육자는 클라이언트와 시민에게 일상생활과 사회생활에 필요한 지식과 기술을 전달한다. 부모교육, 양육 기술, 자기관리 기술, 위기 대처 기술 교육이 대표적인 활동이다."}, {"no": 23, "text": "Hepworth 등이 제시한 업무 특성별 역할 중 개입의 효과를 평가하고 정책 결정에 필요한 자료를 수집·분석하는 역할은?", "passage": "사회복지사는 프로그램 참여자의 변화를 측정하고 결과 자료를 분석하여 다음 연도 사업계획에 반영하였다.", "plabel": "지문", "opts": ["직접서비스 제공", "체계 연결", "연구 및 조사", "체계 유지 및 강화"], "ans": 2, "exp": "연구 및 조사는 개입의 효과성을 평가하고 정책 결정에 필요한 자료를 수집·분석하는 역할이다. 사회복지사의 역할은 직접서비스를 넘어 기관·체계·정책의 차원까지 확장된다."}, {"no": 24, "text": "사례관리의 일반적인 과정으로 가장 적절한 것은?", "passage": "사례관리는 클라이언트의 복합적인 욕구를 파악하고 여러 서비스의 제공 과정을 체계적으로 관리하는 활동이다.", "plabel": "지문", "opts": ["사정 → 계획 → 연계 → 점검", "연계 → 종결 → 사정 → 계획", "점검 → 계획 → 사정 → 연계", "계획 → 연계 → 사정 → 점검"], "ans": 0, "exp": "사례관리는 클라이언트의 욕구·강점·환경을 사정하고, 목표와 서비스 계획을 수립한 뒤, 적절한 자원을 연계하고 서비스의 진행과 효과를 점검하는 과정으로 이루어진다."}, {"no": 25, "text": "사회복지사의 통합적 정체성에 관한 설명으로 가장 옳은 것은?", "passage": null, "plabel": "지문", "opts": ["사회복지사는 임상가 역할만 수행해야 전문성이 유지된다.", "사회복지사는 자신의 일을 한 역할로 한정하지 않고 상황과 경력에 따라 여러 역할을 연결할 수 있다.", "모든 사회복지사는 모든 역할을 동시에 같은 비중으로 수행해야 한다.", "미시 실천과 거시 실천은 서로 관련이 없는 별개의 직업 영역이다."], "ans": 1, "exp": "통합적 정체성은 사회복지사가 자신의 실천을 한 역할로 환원하지 않고, 클라이언트와 환경의 상황 및 자신의 경력 단계에 따라 여러 역할을 연결할 수 있다는 관점이다. 모든 역할을 항상 같은 비중으로 수행한다는 뜻은 아니다."}]}, {"n": 4, "t": "사회복지실천의 가치와 윤리", "qs": [{"no": 26, "text": "사회복지실천에서의 가치와 윤리에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["가치는 무엇이 좋고 바람직한가에 대한 믿음이다.", "윤리는 가치에서 비롯되어 무엇이 옳고 그른가를 판단하는 도덕적 지침이다.", "가치는 개인적·사회적·기관·전문직 차원으로 구분된다.", "가치와 윤리는 동일한 개념으로 사용되며 구분할 필요가 없다."], "ans": 3, "exp": "가치와 윤리는 실천 현장에서 종종 혼용되지만 개념적으로는 구분된다. 가치는 믿음이고 윤리는 행동 지침이다."}, {"no": 27, "text": "한국사회복지사 윤리강령 및 윤리강령의 기능에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["전문가 자신과 타인의 가치관 차이를 체계적으로 확인하는 데 도움을 준다.", "윤리적 딜레마의 실태를 이해하고 대처하는 능력의 기반이 된다.", "사회복지사 선서는 사회복지사가 공공이익보다 개인이익을 앞세울 것을 명시한다.", "여러 가치 사이의 우선순위와 위계를 정립하는 데 활용된다."], "ans": 2, "exp": "사회복지사 선서는 \"개인이익보다 공공이익을 앞세운다\"고 명시한다. 선택지는 이를 거꾸로 서술한 것이다."}, {"no": 28, "text": "Loewenberg, Dolgoff, Harrington이 제시한 일곱 가지 윤리원칙의 위계 순으로 가장 가까운 것은? (높은 순위부터)", "passage": null, "plabel": "지문", "opts": ["삶의 보호 → 평등과 불평등 → 자율성과 자유 → 비밀보장 → 정직과 솔직함", "삶의 보호 → 자율성과 자유 → 평등과 불평등 → 비밀보장 → 정직과 솔직함", "자율성과 자유 → 삶의 보호 → 평등과 불평등 → 삶의 질 → 비밀보장", "비밀보장 → 삶의 보호 → 자율성과 자유 → 평등과 불평등 → 정직과 솔직함"], "ans": 0, "exp": "일곱 원칙의 위계는 ① 삶의 보호 ② 평등과 불평등 ③ 자율성과 자유 ④ 최소한의 해 ⑤ 삶의 질 ⑥ 사생활과 비밀보장 ⑦ 정직과 솔직함 순이다. 두 원칙이 충돌할 때 위 순위의 원칙이 우선한다."}, {"no": 29, "text": "윤리적 딜레마의 세 유형에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["자기결정과 보호의 딜레마", "비밀보장과 보고 의무의 딜레마", "클라이언트 충성과 기관·제3자 충성의 딜레마", "결과의 모호성 딜레마"], "ans": 3, "exp": "윤리적 딜레마를 자기결정과 보호, 비밀보장과 보고 의무, 클라이언트 충성과 기관·제3자 충성의 세 유형으로 구분한다. 결과의 모호성은 이 분류의 세 유형에 포함되지 않는다."}, {"no": 30, "text": "다음 사례에서 사회복지사가 마주한 윤리적 갈등의 성격과 해결 방향으로 가장 적절한 것은?", "passage": "법정 신고의무자 지위에 있는 사회복지사 C는 중학생 D로부터 \"아빠가 자주 때리지만, 절대 비밀로 해달라\"는 호소를 들었다. D는 \"신고하면 가족이 무너진다\"며 강하게 비밀보장을 요구하고 있다.", "plabel": "사례", "opts": ["클라이언트의 자기결정권을 존중하여 D의 요구대로 비밀을 지킨다.", "정직과 솔직함의 원칙에 따라 D에게 신고할 수 없다고 솔직하게 알린다.", "삶의 보호와 최소한의 해 원칙이 비밀보장보다 우선하므로 아동학대 신고 절차를 진행하되, D와 가족에 대한 지지와 보호 계획을 함께 마련한다.", "가해자의 친권이 아동의 안전보다 우선하므로 개입을 보류한다."], "ans": 2, "exp": "이 사례에서는 비밀보장과 보고 의무가 충돌한다. 생명과 안전을 보호하고 최소한의 위해를 선택하는 원칙에 따라 신고 절차를 진행하되, 신고 사실과 이유를 가능한 범위에서 D에게 설명하고 필요한 정보만 제공하며 D와 가족의 보호 계획을 함께 마련해야 한다."}, {"no": 31, "text": "사회복지실천에서 가치의 네 차원과 그 설명이 잘못 짝지어진 것은?", "passage": null, "plabel": "지문", "opts": ["개인적 가치 — 종교·문화의 영향을 받는 개인의 신념", "사회적 가치 — 역사적으로 형성된 사회 전체의 공감대", "기관의 가치 — 소속 기관 고유의 사명과 책임", "전문직 가치 — 사회복지사 개인이 상황에 따라 임의로 정하는 실천 기준"], "ans": 3, "exp": "전문직 가치는 사회복지사 공동체가 공유하는 실천 가치이다. 개인이 임의로 정하는 기준이 아니며, 윤리강령 등으로 공식화되어 있다."}, {"no": 32, "text": "다음 사례에서 사회복지사가 마주한 윤리적 갈등의 유형으로 가장 적절한 것은?", "passage": "가정폭력 피해 여성이 쉼터 입소를 원하지만, 중학생 자녀는 학교와 친구 때문에 집에 남고 싶어 한다. 사회복지사는 가족 중 누구의 이익과 의사를 우선해야 할지 판단이 어렵다.", "plabel": "사례", "opts": ["자기결정과 보호의 딜레마", "비밀보장과 보고 의무의 딜레마", "사회복지사의 개인 가치와 전문직 가치의 갈등", "클라이언트 충성과 기관·제3자 충성의 딜레마"], "ans": 3, "exp": "가족치료 상황에서 한 구성원의 권익과 다른 구성원의 권익이 충돌하는 경우는 클라이언트 충성과 제3자 충성의 딜레마에 해당한다. 사회복지사는 각 구성원의 안전과 권리를 검토하고 최소 위해의 대안을 모색해야 한다."}, {"no": 33, "text": "다음 중 윤리적 의사결정 모델에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["Reamer의 7단계 모델", "Loewenberg와 Dolgoff의 ETHIC 모델", "Mattison의 관계적·맥락적 모델", "Biestek의 관계의 일곱 가지 원칙"], "ans": 3, "exp": "Reamer의 7단계 모델, Loewenberg와 Dolgoff의 ETHIC 모델, Mattison의 관계적·맥락적 모델을 윤리적 의사결정 모델로 소개한다. Biestek의 일곱 원칙은 사회복지실천 관계의 원칙이다."}, {"no": 34, "text": "윤리적 실천과 구조의 관계에 관한 설명으로 가장 옳은 것은?", "passage": null, "plabel": "지문", "opts": ["윤리적 딜레마는 전적으로 개별 사회복지사의 도덕성 문제이다", "한국사회복지사 윤리강령은 사회적 약자 보호와 사회정의 실천을 사회복지사의 책임으로 명시하지 않는다", "정책과 제도가 미비할 때 같은 윤리적 딜레마가 반복되므로, 윤리적 실천은 부당한 제도에 문제를 제기하고 변화시키는 활동까지 포함한다", "제한된 자원이나 권력의 불균형 같은 구조적 조건은 윤리적 판단과 무관하다"], "ans": 2, "exp": "윤리적 딜레마는 종종 제한된 자원, 부족한 정책, 권력의 불균형 같은 구조적 조건 때문에 발생한다. 따라서 윤리적 실천은 개별 사례의 결정과 더불어 제도를 바꾸는 일까지 포함하며, 윤리강령도 사회적 약자를 보호·대변하고 사회정의를 실천할 책임을 명시한다."}]}, {"n": 5, "t": "사회복지사와 클라이언트의 관계 맺기", "qs": [{"no": 35, "text": "사회복지실천에서 전문적 관계의 다섯 가지 특성에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["사적 친밀성", "의도적 목적성", "시간 제한성", "통제성"], "ans": 0, "exp": "전문적 관계의 다섯 가지 특성은 ① 의도적 목적성 ② 시간 제한성 ③ 헌신 ④ 권위성 ⑤ 통제성이다. 사적 친밀성은 전문적 관계의 특성이 아니라 오히려 경계해야 할 요소이다."}, {"no": 36, "text": "Biestek의 사회복지실천 관계의 일곱 가지 기본 원칙과 그 원칙이 응답하는 클라이언트의 욕구를 잘못 짝지은 것은?", "passage": null, "plabel": "지문", "opts": ["개별화 — 고유한 개인으로 인정받고 싶은 욕구", "비심판적 태도 — 스스로 결정하고 싶은 욕구", "수용 — 가치 있는 인간으로 인정받고 싶은 욕구", "비밀보장 — 사적 정보를 지키고 싶은 욕구"], "ans": 1, "exp": "비심판적 태도는 클라이언트가 판단받고 싶지 않은 욕구에 응답하는 원칙이다. 스스로 결정하고 싶은 욕구에 응답하는 원칙은 자기결정권이다."}, {"no": 37, "text": "사회복지실천 관계에서 비밀보장의 원칙에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["비밀보장은 클라이언트의 기본권에 해당한다.", "비밀보장은 신뢰관계 유지의 기초가 된다.", "비밀보장은 절대적인 원칙이므로 어떠한 경우에도 예외가 없다.", "아동학대 등 법적 신고 의무가 있는 경우에는 비밀보장이 제한될 수 있다."], "ans": 2, "exp": "비밀보장은 절대적 비밀이 아닌 상대적 비밀이 일반적이다. 슈퍼바이저나 동료와의 정보 공유, 클라이언트의 동의에 따른 공유, 아동학대 신고 의무 등 법적 요구가 있을 때에는 비밀보장이 제한된다."}, {"no": 38, "text": "관계 형성을 어렵게 만드는 장애요인에 관한 다음 설명 중 옳은 것을 모두 고른 것은?", "passage": "ㄱ. 전이는 클라이언트가 과거의 무의식적 감정을 사회복지사에게 옮겨놓는 현상이다.\nㄴ. 역전이는 사회복지사가 자신의 미해결된 감정을 클라이언트에게 투사하는 현상이다.\nㄷ. 양가감정은 클라이언트가 변화하고 싶은 마음과 머물고 싶은 마음을 동시에 가지는 상태이다.\nㄹ. 저항은 클라이언트의 의지가 약한 것이므로 사회복지사가 강하게 설득해야 한다.", "plabel": "보기", "opts": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "ans": 0, "exp": "ㄱ, ㄴ, ㄷ는 모두 옳은 설명이다. ㄹ는 옳지 않다. 저항은 의지의 약함이 아니라 변화에 대한 두려움과 양면성의 표현이므로, 강한 설득보다는 그 의미를 함께 살피고 다루어야 한다."}, {"no": 39, "text": "다음 사례에서 사회복지사 E의 대응에 관한 평가로 가장 적절한 것은?", "passage": "이주 노동자 F씨는 임금 체불 문제로 사회복지관을 찾았다. 상담 중 F씨는 \"한국 사람들은 어차피 다 그래요. 선생님도 결국 똑같지 않겠어요?\"라며 거리를 두는 태도를 보였다. 사회복지사 E는 \"그렇게 말씀하시는 데에는 분명히 이유가 있을 것 같습니다. 어떤 경험을 하셨는지 들어보고 싶어요\"라고 응답했다.", "plabel": "사례", "opts": ["클라이언트의 부정적 발언을 무조건 수용하므로 관계 형성에 도움이 되지 않는다.", "클라이언트의 자기결정권을 침해하는 응답이다.", "클라이언트의 불신과 방어적 태도를 인정하면서 그 배경을 탐색하려는 적절한 반응이다.", "클라이언트의 감정표현을 차단하는 비심판적 태도의 위반이다."], "ans": 2, "exp": "F씨의 발언은 과거의 부정적 경험에 기초한 불신과 방어적 태도로, 관계 형성의 흔한 장애요인이다. 사회복지사 E의 응답은 ① F씨의 감정을 비난하지 않고(비심판적 태도) ② 감정 뒤의 경험을 묻고 들어보겠다는 자세를 보이며(의도적 감정표현과 수용) ③ 클라이언트의 개별 경험을 존중한다(개별화). Biestek의 여러 원칙이 한 응답 안에서 동시에 작동하는 모습으로, 관계 형성의 초기 단계에서 권장되는 반응이다."}, {"no": 40, "text": "전문적 관계의 특성 중 '사회복지사의 이익보다 클라이언트의 이익을 우선한다'는 내용에 해당하는 것은?", "passage": null, "plabel": "지문", "opts": ["헌신", "권위성", "통제성", "의도적 목적성"], "ans": 0, "exp": "전문적 관계의 다섯 특성 중 헌신은 사회복지사의 이익보다 클라이언트의 이익을 우선하는 것이다. 권위성은 전문 지식·기술·윤리강령에 기반한 권위, 통제성은 사회복지사 자신의 감정·반응·충동을 자각하고 책임지는 것, 의도적 목적성은 합의된 목적이 있다는 것이다."}, {"no": 41, "text": "Biestek의 일곱 가지 원칙 중 클라이언트가 '감정을 자유롭게 표현하고 싶은 욕구'에 응답하는 원칙은?", "passage": null, "plabel": "지문", "opts": ["수용", "의도적 감정표현", "통제된 정서적 관여", "개별화"], "ans": 1, "exp": "의도적 감정표현은 클라이언트가 감정을 자유롭게 표현하고 싶은 욕구에 응답하는 원칙이다. 통제된 정서적 관여는 공감적 반응을 얻고 싶은 욕구, 수용은 가치 있는 인간으로 인정받고 싶은 욕구, 개별화는 독특한 개인으로 인정받고 싶은 욕구에 응답한다."}, {"no": 42, "text": "다음 사례에서 나타난 관계 형성의 장애요인으로 가장 적절한 것은?", "passage": "사회복지사 U는 어린 시절 권위적인 아버지와 갈등이 깊었다. 최근 권위적인 말투를 쓰는 중년 남성 클라이언트를 만날 때마다 이유를 설명하기 어려운 짜증과 거부감이 들어 면담에 집중하기 어렵다.", "plabel": "사례", "opts": ["전이(transference)", "저항(resistance)", "역전이(countertransference)", "양가감정(ambivalence)"], "ans": 2, "exp": "역전이는 사회복지사가 자신의 미해결된 감정을 클라이언트에게 투사하는 현상이다. 전이는 반대로 클라이언트가 과거의 무의식적 감정을 사회복지사에게 옮겨놓는 현상이다."}, {"no": 43, "text": "관계의 따뜻함과 정직함에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["클라이언트를 무조건 편안하게 해주는 관계는 변화 없는 관계로 끝나기 쉽다", "직면은 클라이언트의 모순을 부드럽게 짚어주는 기술이다", "사회복지사의 정직함은 깊은 수용 위에서만 변화의 힘을 갖는다", "직면은 클라이언트의 잘못을 비판하고 평가하여 바로잡는 기술이다"], "ans": 3, "exp": "직면은 비판이나 평가가 아니라, 클라이언트가 보지 못한 모순을 부드럽게 함께 마주하게 하는 기술이다. 정직함은 깊은 수용 위에서만 작동한다."}]}, {"n": 6, "t": "의사소통과 면담의 기술", "qs": [{"no": 44, "text": "면담의 기본 기술에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["관찰은 클라이언트의 언어적 표현뿐 아니라 비언어적 표현에도 주의를 기울이는 기술이다.", "경청은 단순히 소리를 듣는 것이 아니라 클라이언트의 사고와 감정을 이해하기 위한 적극적 청취 활동이다.", "요약은 클라이언트의 말을 사회복지사의 언어로 정리해 정확한 이해를 확인하는 기술이다.", "침묵은 면담에서 반드시 즉시 채워야 할 빈 시간이다."], "ans": 3, "exp": "침묵은 클라이언트가 생각을 정리하거나 감정을 다스리는 의미 있는 시간이며, 즉시 채워야 할 빈 시간이 아니다. 다만 지나치게 길어지지 않도록 사회복지사가 적절히 조율할 필요는 있다."}, {"no": 45, "text": "다음 중 개방형 질문(open-ended question)에 해당하는 것은?", "passage": null, "plabel": "지문", "opts": ["오늘 식사는 하셨나요?", "어머니와는 자주 연락하세요?", "가장 힘드신 점이 무엇인지 좀 더 이야기해 주시겠어요?", "약을 매일 드시나요?"], "ans": 2, "exp": "개방형 질문은 클라이언트가 자유롭게 답할 수 있도록 열어두는 질문이다. ①②④는 \"예/아니오\"로 답할 수 있는 폐쇄형 질문이다."}, {"no": 46, "text": "사회복지실천 면담에서 피해야 할 부적절한 의사소통 유형에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["극적인 해석과 명명(예: \"당신은 ○○성격장애군요.\")", "적극적 경청과 공감적 반응", "겉치레식 확신과 동정(예: \"다 잘 될 거예요.\")", "위협과 경고(예: \"그렇게 안 하면 후회하실 거예요.\")"], "ans": 1, "exp": "적극적 경청과 공감적 반응은 면담에서 가장 권장되는 의사소통 방식이다. 나머지는 클라이언트의 저항·적대감·의사소통 단절을 유발하는 부적절한 유형이다."}, {"no": 47, "text": "접수(intake) 단계에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["접수는 클라이언트와 사회복지사가 처음 만나는 초기 상담 과정이다.", "접수 단계에서는 정보 수집보다 신뢰관계 형성에 우선 초점을 둔다.", "사회복지사는 기관의 정책, 가능한 서비스, 기관의 한계점을 설명해야 한다.", "클라이언트의 욕구가 기관 서비스와 맞지 않으면 가능한 한 자체적으로 해결한다."], "ans": 3, "exp": "클라이언트의 욕구와 기관 서비스가 맞지 않으면 적절한 다른 기관으로 적극적으로 의뢰하는 것이 사회복지사의 윤리적 책임이다. 부적합한 서비스를 무리하게 제공하거나 클라이언트를 방치해서는 안 된다."}, {"no": 48, "text": "다음 사례에서 사회복지사 G가 지켜야 할 첫 만남의 윤리적 원칙으로 가장 적절한 것은?", "passage": "30대 여성 H씨가 가정폭력 문제로 사회복지관을 방문했다. 사회복지사 G는 H씨에게 자세한 상황을 들으려 하지만, H씨는 \"혹시 제가 한 이야기가 남편이나 다른 사람에게 알려지지는 않겠죠?\"라며 강하게 비밀보장을 요구한다.", "plabel": "사례", "opts": ["클라이언트의 자기결정권을 존중해 어떠한 경우에도 비밀이 새지 않을 것임을 약속한다.", "H씨에게 사례 회의·슈퍼비전·법적 의무가 있는 경우(예: 아동학대 신고)에는 비밀보장이 제한될 수 있음을 명확히 설명하고, 그 외 정보는 보호된다는 점을 알린 후 동의를 받는다.", "일단 모든 정보를 다 수집한 후, 면담 끝에 한꺼번에 사후 동의를 받는다.", "클라이언트의 두려움이 큰 만큼, 비밀보장에 관한 설명은 생략하고 곧장 본 상담으로 들어간다."], "ans": 1, "exp": "첫 만남에서 사회복지사는 충분한 정보제공 후 동의(informed consent)의 원칙을 지켜야 한다. 비밀보장은 절대적이지 않고 상대적 비밀이 일반적이며, 슈퍼비전, 다학제 팀 협력, 아동학대 신고 의무 등 법적 요건이 있을 때는 제한될 수 있다. 이러한 한계를 미리 솔직히 설명하고 동의를 받는 것이 윤리적 실천의 핵심이다. ①은 지킬 수 없는 약속을 하는 것이고, ③④는 정보제공 후 동의의 원칙을 위반한다."}, {"no": 49, "text": "다음 사회복지사의 질문에 해당하는 유형으로 가장 적절한 것은?", "passage": "\"그러니까 결국 남편과 헤어지는 것이 옳다고 생각하시는 거죠?\"", "plabel": "지문", "opts": ["개방형 질문", "유도형 질문", "간접적 질문", "명료화"], "ans": 1, "exp": "특정한 답을 전제하거나 암시하는 질문은 유도형 질문으로, 폐쇄형 질문의 남용·중첩형 질문과 함께 면담을 막히게 하는 대표적인 부적절한 질문이다."}, {"no": 50, "text": "면담에서의 의사소통에 관한 설명으로 가장 옳은 것은?", "passage": null, "plabel": "지문", "opts": ["면담에서 메시지는 언어 내용으로만 전달되므로 말의 정확성만 중요하다.", "클라이언트의 비언어적 표현은 관찰의 대상이 아니다.", "침묵은 의사소통이 아니므로 즉시 말로 채워야 한다.", "특히 정서적 메시지를 이해할 때 목소리·억양·표정·자세 같은 비언어적 단서를 함께 살피되, 문화와 상황을 고려해 해석해야 한다."], "ans": 3, "exp": "정서적 메시지에서 비언어적 단서의 중요성을 설명하면서도 이 단서를 모든 의사소통에 기계적으로 일반화해서는 안 된다고 강조한다. 침묵과 비언어적 표현은 문화와 상황을 고려해 관찰하고 해석해야 한다."}, {"no": 51, "text": "접수 양식(초기면접지)에 기록되는 내용으로 가장 거리가 먼 것은?", "passage": null, "plabel": "지문", "opts": ["종결 평가 결과와 변화 유지 계획", "기본 정보와 주요 문제", "기관에 오게 된 동기와 의뢰 사유", "이전 서비스 경험과 가족관계"], "ans": 0, "exp": "접수 양식에는 기본 정보, 주요 문제, 기관에 오게 된 동기, 의뢰 사유, 이전 서비스 경험, 가족관계 등이 기록된다. 종결 평가와 변화 유지 계획은 종결 단계(9강)의 내용이다."}]}, {"n": 7, "t": "사정 — 한 사람에서 공동체까지 살펴보기", "qs": [{"no": 52, "text": "사회복지실천에서 사정(assessment)에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["사정은 자료 수집을 바탕으로 클라이언트의 상황을 해석하는 작업이다.", "사정은 사회복지실천 과정 중 한 번만 이루어지며 이후에는 수정되지 않는다.", "좋은 사정은 클라이언트와 함께 만들어가는 협력적 과정이다.", "사정에서는 문제뿐 아니라 강점과 자원도 함께 살펴본다."], "ans": 1, "exp": "사정은 한 번으로 끝나는 일회적 작업이 아니라, 사회복지실천 과정 전반에 걸쳐 지속적으로 이루어지며 새로운 정보에 따라 수정·보완된다."}, {"no": 53, "text": "가계도(genogram)와 생태도(eco-map)에 관한 설명으로 옳은 것을 모두 고른 것은?", "passage": "ㄱ. 가계도는 3대 이상의 가족 구조와 관계의 질을 그림으로 표현한다.\nㄴ. 생태도는 클라이언트와 외부 체계(가족·학교·직장·이웃 등) 사이의 관계망을 보여준다.\nㄷ. 생태도에서는 관계의 성격(친밀·갈등·소원·단절)을 선의 종류와 굵기로 표현한다.\nㄹ. 가계도와 생태도는 모두 사회복지사가 클라이언트와 함께 작성하는 것이 바람직하다.", "plabel": "보기", "opts": ["ㄱ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "ans": 3, "exp": "네 항목 모두 옳은 설명이다. 특히 사정 도구는 사회복지사가 단독으로 작성하는 것이 아니라 클라이언트와 함께 작성함으로써 클라이언트의 자기이해와 변화 동기를 함께 높이는 도구로 활용된다."}, {"no": 54, "text": "사정의 단위(차원)에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["지역사회 사정은 결핍과 문제의 목록을 작성하는 것에 한정된다.", "개인 사정은 클라이언트의 신체·심리·사회적 측면을 함께 본다.", "가족 사정은 가족의 구조, 발달 단계, 의사소통, 권력 균형 등을 살핀다.", "집단 사정은 집단의 목적, 구성원의 다양성, 집단 내 역동을 본다."], "ans": 0, "exp": "지역사회 사정은 결핍과 문제의 목록을 작성하는 것에 한정되지 않는다. 오히려 자산기반 사정에서는 지역사회를 결핍의 목록이 아니라 자산의 지도로 본다. 결핍 중심 사정은 지역사회에 대한 부정적 낙인을 강화할 위험이 있다."}, {"no": 55, "text": "다음에서 설명하는 사회복지 사정 도구로 가장 적절한 것은?", "passage": "클라이언트의 출생·성장·교육·직업·결혼·자녀·이주·중요한 삶의 사건을 시간 순으로 정리하여 현재 상황을 생애의 흐름 속에서 이해한다.", "plabel": "지문", "opts": ["생태도(ecomap)", "가계도(genogram)", "사회력(social history)", "표준화된 욕구 조사(needs assessment survey)"], "ans": 2, "exp": "사회력은 클라이언트의 생애사를 시간 순으로 정리하는 서술적 사정 도구이다. 출생·성장·교육·직업·결혼·자녀·이주·중요한 삶의 사건 등을 통해 현재 상황을 전체 삶의 흐름 속에서 이해하게 한다."}, {"no": 56, "text": "다음 사례에서 사회복지사가 통합적 사정을 위해 살펴야 할 차원과 그 적용이 가장 적절한 것은?", "passage": "30대 후반 J씨는 우울 증상으로 정신건강복지센터에 의뢰되었다. J씨는 결혼 이주 여성이며, 한국어 능력 부족으로 취업이 어렵고, 시댁과의 갈등이 깊다. 거주 지역은 다문화가족 자조 모임이 활발하다.", "plabel": "사례", "opts": ["개인 차원(우울 증상)·가족 차원(시댁 갈등)·공동체 차원(자조 모임과 한국어 학습 자원)을 통합적으로 사정하고 각 차원의 개입을 함께 설계한다.", "개인 차원만 본다 — J씨의 우울증을 약물 치료로 해결한다.", "가족 차원만 본다 — 시댁 갈등을 가족 상담만으로 해결한다.", "사회구조 차원만 본다 — 다문화가족 정책 개선만을 우선한다."], "ans": 0, "exp": "한 클라이언트의 어려움은 대개 여러 차원에서 동시에 작동한다. J씨의 사례는 ① 개인 차원(우울 증상) ② 가족 차원(시댁 갈등) ③ 사회·공동체 차원(이주 여성으로서의 위치, 노동시장 진입 장벽, 그리고 자조 모임이라는 지역 자산)이 함께 얽혀 있다. 통합적 사정은 어느 한 차원으로 환원하지 않고 세 차원을 함께 보면서, 각 차원에 맞는 개입을 동시에 설계하는 작업이다."}, {"no": 57, "text": "자료 수집과 사정(assessment)의 관계에 관한 설명으로 가장 옳은 것은?", "passage": null, "plabel": "지문", "opts": ["사정과 자료 수집은 동일한 개념이다", "사정은 자료 수집 이전에 먼저 완료되어야 한다", "자료 수집이 '무엇이 있는가'를 모으는 일이라면, 사정은 그 자료가 '무엇을 의미하는가'를 읽어내는 해석의 작업이다", "사정은 사회복지사가 단독으로 수행하는 진단 행위이다"], "ans": 2, "exp": "사정은 자료 수집에서 한 단계 더 나아간 해석의 작업이다. 클라이언트와 함께 만들며, 과정 전체에 걸쳐 지속된다."}, {"no": 58, "text": "가족 사정에서 살펴보는 차원에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["가족의 구조와 발달 단계", "가족 내 의사소통과 역할 분배", "가족 안의 권력 균형", "집단의 형성 단계와 집단 규범"], "ans": 3, "exp": "가족 사정에서는 가족의 구조, 발달 단계, 의사소통, 역할 분배, 외부와의 관계, 권력 균형 등을 살핀다. 집단의 형성 단계와 집단 규범은 집단 사정의 항목이다."}, {"no": 59, "text": "클라이언트 참여 사정(participatory assessment)에 관한 설명으로 가장 옳은 것은?", "passage": null, "plabel": "지문", "opts": ["전문가가 만든 표준 양식에 따라 정보를 수집하는 데 그친다.", "클라이언트가 사정의 객체가 아니라 주체로 참여하며 사회복지사와 결과를 공유하고 합의한다.", "클라이언트의 약점과 결함을 우선적으로 분류한다.", "개인의 심리 상태만을 측정하는 검사 도구이다."], "ans": 1, "exp": "참여 사정은 클라이언트가 사정의 객체가 아니라 주체로 참여하는 방식이다. 사회복지사는 사정 전 과정에서 협력하고, 강점과 자원에 무게를 두며, 결과를 클라이언트와 공유하고 합의한다."}, {"no": 60, "text": "사정의 편향에 관한 다음 설명의 빈칸에 들어갈 말이 순서대로 옳게 짝지어진 것은?", "passage": "\"개인 차원만 보면 ( ㄱ )에 빠지기 쉽고, 구조 차원만 보면 ( ㄴ )을 놓친다.\"", "plabel": "지문", "opts": ["ㄱ: 피해자 비난(blame the victim) / ㄴ: 지금 당장 이 사람이 견디고 있는 고통", "ㄱ: 과잉 일반화 / ㄴ: 정책의 한계", "ㄱ: 낙인 / ㄴ: 가족의 역할 분배", "ㄱ: 전이 / ㄴ: 지역사회의 자원 분배"], "ans": 0, "exp": "개인 차원만 보는 사정은 피해자 비난에 빠지기 쉽고, 구조 차원만 보는 사정은 지금 당장 이 사람이 견디고 있는 고통을 놓친다. 따라서 사정은 미시·메조·매크로를 통합적으로 보아야 한다."}]}, {"n": 8, "t": "개입의 설계와 실행", "qs": [{"no": 61, "text": "개입 목표 설정의 SMART 원칙에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["구체적(Specific)", "사회복지사 주도의(Social worker-led)", "측정 가능한(Measurable)", "달성 가능한(Achievable)"], "ans": 1, "exp": "SMART 원칙은 Specific, Measurable, Achievable, Relevant, Time-bound이다. 목표 설정은 사회복지사 주도가 아니라 클라이언트와의 협의와 합의로 이루어져야 한다."}, {"no": 62, "text": "다음에서 설명하는 미시 개입 모델로 가장 적절한 것은?", "passage": "문제의 원인 분석보다 클라이언트가 이미 가진 자원과 예외 상황에 주목한다. \"문제가 일어나지 않는 순간은 언제인가요?\", \"어느 날 아침 일어났더니 문제가 사라졌다면 무엇이 달라져 있을까요?\" 같은 질문을 활용한다.", "plabel": "지문", "opts": ["인지행동 접근", "해결중심 단기치료", "동기면담", "과제중심 모델"], "ans": 1, "exp": "해결중심 단기치료(Solution-Focused Brief Therapy)는 de Shazer와 Berg가 개발한 모델로, 문제의 원인이 아니라 예외 질문, 기적 질문, 척도 질문 등을 통해 클라이언트의 강점과 해결의 자원을 발견하게 한다."}, {"no": 63, "text": "가족 개입과 집단 개입에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["가족 개입은 가족의 의사소통 패턴, 역할, 권력 균형을 주요 표적으로 한다.", "집단 개입에서는 집단 발달 단계에 따라 사회복지사의 역할이 달라진다.", "집단 개입의 핵심 자원은 사회복지사의 일방적 설명과 지시이다.", "가족과 집단 개입에서는 한 사람의 변화보다 관계와 체계의 변화가 목표이다."], "ans": 2, "exp": "집단 개입의 핵심 자원은 사회복지사의 일방적 설명이나 지시가 아니라 구성원 간의 상호작용이다. 사회복지사는 그 상호작용이 잘 이루어지도록 촉진하고 조정하는 역할을 한다."}, {"no": 64, "text": "사회복지사와 클라이언트가 개입 계약을 맺을 때 포함할 내용으로 적절하지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["합의된 목표와 우선순위", "개입의 전략과 방법", "각자의 역할·책임과 개입 기간", "사회복지사가 단독으로 정한 목표와 변경할 수 없는 절차"], "ans": 3, "exp": "개입 계약에는 합의된 목표와 우선순위, 전략과 방법, 각자의 역할과 책임, 기간과 빈도, 평가 기준, 변경·종료 절차가 포함된다. 계약은 사회복지사가 일방적으로 정하는 지시가 아니라 상호 합의이다."}, {"no": 65, "text": "다음 사례에서 사회복지사가 설계할 수 있는 통합 개입으로 가장 적절한 것은?", "passage": "가정폭력 피해 여성 K씨는 5세 자녀와 함께 보호시설로 피신했다. K씨는 외상 후 스트레스 증상을 보이고 있으며, 경제적 자립 능력이 부족하다. 거주 지역에는 가정폭력 피해자 자조 모임이 운영되고 있으나, 가정폭력 보호법의 일부 조항이 피해자의 자기결정권을 충분히 보장하지 못한다는 비판이 제기되어 왔다.", "plabel": "사례", "opts": ["미시 차원의 개별 상담만 진행한다.", "자조 모임 참여만 권유한다.", "정책 개정 운동에만 집중한다.", "개별 상담·안전 계획(미시), 자조 모임 참여와 자녀 양육 지원(메조), 가정폭력 보호법 개정 운동 연대(매크로)를 함께 설계하고 단계적으로 실행한다."], "ans": 3, "exp": "K씨의 어려움은 ① 개인 차원(트라우마와 자립 역량) ② 가족·집단 차원(자녀 양육과 자조 모임의 사회적 지지) ③ 사회구조 차원(가정폭력 보호법의 한계)에 걸쳐 있다. 통합 개입은 세 차원에 맞는 활동을 동시에 또는 단계적으로 배치한다. 어느 한 차원의 개입만으로는 문제가 반복된다."}, {"no": 66, "text": "개입 설계에서 변화 이론(theory of change)의 의미로 가장 적절한 것은?", "passage": null, "plabel": "지문", "opts": ["이 개입이 왜 이 클라이언트에게 변화를 만들 것이라고 생각하는가에 대한 분명한 가설", "클라이언트의 성격 변화를 설명하는 인간발달 이론", "사회 전체의 역사적 변화를 설명하는 거시 사회이론", "개입 종결 후 작성하는 성과 평가 보고서"], "ans": 0, "exp": "개입 전체는 하나의 변화 이론에 기초해야 한다. 즉 \"이 개입이 왜 이 클라이언트에게 변화를 만들 것이라고 생각하는가\"에 대한 분명한 가설이 있어야 한다."}, {"no": 67, "text": "미시 개입 모델과 대표 학자가 잘못 짝지어진 것은?", "passage": null, "plabel": "지문", "opts": ["인지행동 접근 — Beck, Ellis", "해결중심 단기치료 — de Shazer, Berg", "동기면담 — Miller와 Rollnick", "과제중심 모델 — White와 Epston"], "ans": 3, "exp": "과제중심 모델은 Reid와 Epstein이 발전시킨 모델이다. 따라서 과제중심 모델을 White와 Epston과 연결한 ④가 잘못된 짝이다."}, {"no": 68, "text": "다음 사례에서 활용하기에 가장 적절한 미시 개입 접근은?", "passage": "음주 문제로 의뢰된 클라이언트 V씨는 \"술을 줄여야 한다는 건 알지만, 술 없이는 하루를 못 버틸 것 같다\"고 말하며 변화를 원하는 마음과 망설이는 마음 사이에서 흔들리고 있다.", "plabel": "사례", "opts": ["인지행동 접근 — 왜곡된 사고의 재구조화에 집중한다", "동기면담 — 양가감정을 가진 클라이언트가 스스로의 언어로 변화의 이유를 표현하도록 돕는다", "과제중심 모델 — 짧고 구체적인 과제를 부여해 단기간에 변화를 시도한다", "위기개입 — 급성 위기 상황의 안정화에 초점을 둔다"], "ans": 1, "exp": "동기면담(Miller & Rollnick)은 변화에 대한 양가감정을 가진 클라이언트가 스스로의 언어로 변화의 이유를 표현하도록 돕는 접근으로, V씨처럼 변화의 동기가 흔들리는 상황에 가장 적합하다."}, {"no": 69, "text": "인지행동 개입의 주요 기법에 해당하지 않는 것은?", "passage": "다음 보기 중 하나는 해결중심 단기치료에서 주로 활용되는 기법이다.", "plabel": "지문", "opts": ["자동적 사고의 인식", "인지 왜곡의 점검", "합리적 대안 사고의 형성", "기적 질문을 통한 원하는 미래의 탐색"], "ans": 3, "exp": "자동적 사고의 인식, 인지 왜곡의 점검, 합리적 대안 사고의 형성은 인지행동 개입의 주요 기법이다. 기적 질문은 해결중심 단기치료에서 활용한다."}]}, {"n": 9, "t": "평가와 종결", "qs": [{"no": 70, "text": "사회복지실천 평가 방법에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["평가는 종결 시점에 한 번만 실시하는 일회적 활동이다.", "단일사례설계는 한 클라이언트의 변화를 시간 순서대로 측정해 비교한다.", "형성평가는 개입이 진행되는 동안 정보를 수집하여 개입을 조정하고 개선하는 데 활용한다.", "프로그램 평가는 개입의 효과성·효율성·적절성을 프로그램 단위에서 확인한다."], "ans": 0, "exp": "평가는 종결 시점에만 이루어지는 활동이 아니라 실천 과정 전반에 걸쳐 지속된다. 단일사례설계, 형성평가, 프로그램 평가는 각각 개인의 변화 측정, 진행 중 개입 개선, 프로그램 단위의 성과 검토에 활용된다."}, {"no": 71, "text": "종결 유형과 설명의 연결이 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["계획된 종결 — 합의한 목표를 달성하고 예정된 시점에 관계를 마무리하는 경우", "조기 종결 — 합의한 목표나 기간에 이르기 전에 클라이언트가 서비스를 중단하는 경우", "강제 종결 — 기관의 서비스 종료, 사회복지사의 이직 등 외부 사유로 관계가 끝나는 경우", "강제 종결 — 사회복지사가 설명과 준비 없이 일방적으로 관계를 끝내는 경우"], "ans": 3, "exp": "계획된 종결, 조기 종결, 강제 종결을 구분한다. 강제 종결은 기관이나 사회복지사의 외부 사유로 불가피하게 관계가 끝나는 경우이며, 이때에도 클라이언트에게 설명하고 가능한 대안을 마련하며 종결을 준비해야 한다."}, {"no": 72, "text": "의뢰(referral)에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["클라이언트의 욕구가 기관의 역량을 넘어설 때 사회복지사는 적극적으로 의뢰한다.", "좋은 의뢰는 의뢰처에 대한 충분한 정보를 클라이언트에게 제공한다.", "의뢰는 본 기관의 책임을 다른 기관에 떠넘기는 효율적인 방법이다.", "의뢰 후에도 연계가 잘 이루어졌는지 사후 점검을 한다."], "ans": 2, "exp": "의뢰는 책임의 이전이 아니라 클라이언트에게 가장 적합한 자원을 연결하는 윤리적 책무이다. 떠넘기기식 의뢰는 클라이언트의 부담만 키우고 서비스의 연속성을 깨뜨린다."}, {"no": 73, "text": "사회복지실천에서 기록과 사회보장정보시스템(행복e음)에 관한 설명으로 옳은 것을 모두 고른 것은?", "passage": "ㄱ. 기록은 동료·슈퍼바이저·다른 기관과의 의사소통의 기초가 된다.\nㄴ. 문제지향 기록(SOAP)은 주관적 정보, 객관적 정보, 사정, 계획의 네 부분으로 구성된다.\nㄷ. 행복e음은 공공 중심의 사회보장정보시스템이며, 일부 기관·서비스는 정해진 권한과 절차에 따라 연계된다.\nㄹ. 사회복지사는 행복e음 접근 시 업무 수행에 필요한 범위에서만 정보에 접근한다.", "plabel": "보기", "opts": ["ㄱ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "ans": 3, "exp": "네 항목 모두 옳다. 기록은 의사소통과 책임성의 기초이고, SOAP은 주관적 정보·객관적 정보·사정·계획으로 구성된다. 행복e음은 공공 중심 시스템이며 정보의 접근과 연계는 업무상 필요, 부여된 권한, 동의 또는 법적 근거와 정해진 절차에 따라 제한된다."}, {"no": 74, "text": "다음 사례에서 사회복지사 L이 종결 단계에서 수행해야 할 가장 적절한 활동은?", "passage": "사회복지관에서 6개월간 개별 상담을 받아온 우울증 클라이언트 M씨는 증상이 상당히 호전되어 종결을 앞두고 있다. 그러나 M씨는 \"선생님 없으면 다시 우울해질 것 같아 무섭다\"며 종결을 두려워한다. 한편 M씨는 최근 부부 갈등이 새로 부각되고 있으며, 본 기관은 부부 상담 전문성은 부족하다.", "plabel": "사례", "opts": ["M씨와 함께 그동안의 변화를 돌아보고 분리 감정을 다루며, 변화 유지 계획을 함께 세우고, 부부 상담은 적절한 기관으로 의뢰한 후 사후 점검을 한다.", "종결을 미루고 사회복지사 L이 부부 상담까지 전담한다.", "M씨의 두려움을 무시하고 계획대로 종결한다.", "M씨의 동의 없이 부부 상담 기관으로 정보를 전달한다."], "ans": 0, "exp": "좋은 종결은 ① 개입 과정 돌아보기, ② 분리 감정 다루기, ③ 변화 유지 계획 수립, ④ 필요한 경우 적절한 자원으로의 의뢰와 사후 점검을 포함한다. 선지 ②는 사회복지사 역량을 넘어선 영역까지 떠안는 비윤리적 실천이고, ③은 클라이언트의 감정을 무시한 것이며, ④는 동의 없는 정보 공유로 비밀보장 원칙 위반에 해당한다."}, {"no": 75, "text": "단일사례설계(single subject design)에서 '기초선(baseline)'의 의미로 가장 적절한 것은?", "passage": null, "plabel": "지문", "opts": ["개입을 시작하기 전 클라이언트의 상태를 측정한 자료", "개입 종료 후 측정한 클라이언트 만족도", "프로그램 예산 집행의 기준 금액", "과업성취척도에서 가장 낮은 단계"], "ans": 0, "exp": "단일사례설계는 한 클라이언트를 대상으로 개입 전(기초선)과 개입 중·후의 변화를 시간 순서대로 측정해 비교하는 평가 방법이다."}, {"no": 76, "text": "면담 내용을 시간 순서대로 자세히 기록하는 기록 유형은?", "passage": null, "plabel": "지문", "opts": ["요약 기록", "문제지향 기록(SOAP)", "과정 기록", "접수 기록"], "ans": 2, "exp": "과정 기록은 면담 내용을 시간 순서대로 자세히 기록하는 유형이다. 요약 기록은 주요 내용만 정리하며, 문제지향 기록(SOAP)은 주관적 정보·객관적 정보·사정·계획의 네 부분으로 구성된다."}, {"no": 77, "text": "사회보장정보시스템(행복e음)의 정보 접근과 공유에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["사회복지사는 업무 수행에 필요한 범위에서만 정보에 접근한다.", "정보는 정보주체의 동의 또는 명확한 법적 근거와 정해진 절차에 따라 공유한다.", "접속 기록과 권한 관리를 통해 부적절한 접근을 통제한다.", "민간기관과의 정보 연계는 별도 권한이나 정보주체의 동의 없이 자유롭게 이루어진다."], "ans": 3, "exp": "행복e음의 정보 접근과 공유는 업무상 필요한 범위, 부여된 권한, 정보주체의 동의 또는 법적 근거, 정해진 연계 절차에 따라 제한되어야 한다. 별도 권한이나 근거 없이 자유롭게 연계할 수 있다는 ④는 옳지 않다."}]}, {"n": 10, "t": "공동체 조직화와 함께 운영하기", "qs": [{"no": 78, "text": "공동체 조직화의 사상적 흐름에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["공동체 조직화는 주민을 시혜의 대상으로 보고 도움을 제공하는 활동이다.", "알린스키는 「급진주의자를 위한 규칙」에서 가난한 지역 주민이 권력에 맞서 자기 이익을 조직화하는 전략을 체계화했다.", "프레이리는 「피억압자의 교육학」에서 비판적 의식화의 과정을 제시했다.", "한국의 주민운동은 1970~80년대 빈민·노동 운동에 뿌리를 둔다."], "ans": 0, "exp": "공동체 조직화는 주민을 시혜의 대상이 아니라 변화의 주체로 본다. 이 점이 전통적 자선·구빈 활동과 가장 큰 차이이다."}, {"no": 79, "text": "공동체 조직가에게 필요한 역량을 KSA 틀로 분류할 때, 그 짝이 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["지식(Knowledge) — 지역사회 구조와 자원, 관련 법령과 제도에 대한 이해", "기술(Skills) — 회의 진행, 갈등 조정, 자원 동원", "태도(Attitudes) — 사회복지사의 권위를 강하게 내세우는 자세", "태도(Attitudes) — 주민을 전문가로 존중하는 자세와 장기 호흡"], "ans": 2, "exp": "공동체 조직가의 태도는 자기 권위를 절제하고 주민의 전문성을 존중하는 것이다. 권위를 강하게 내세우는 자세는 주민을 변화의 주체에서 시혜의 대상으로 끌어내리며, 공동체 조직화의 기본 원칙에 어긋난다."}, {"no": 80, "text": "좋은 거버넌스(governance)가 갖추어야 할 네 가지 요소에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["대표성 — 누가 의사결정에 참여하는가", "효율성 — 소수가 빠르게 의사결정을 내리는가", "투명성 — 결정 과정이 공개되는가", "참여 — 주민이 실질적으로 참여하는가"], "ans": 1, "exp": "좋은 거버넌스의 네 가지 요소는 대표성·투명성·책무성·참여이다. 소수의 빠른 의사결정은 효율적으로 보일 수 있으나, 대표성과 참여를 훼손해 결국 공동체의 지속가능성을 떨어뜨린다."}, {"no": 81, "text": "한국의 공동체 영역에 동시에 작동하는 법령에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["공동주택관리법은 아파트 단지의 입주자대표회의 등 공동주택 자치 구조를 규정한다.", "협동조합기본법은 5인 이상의 발기인이 공동의 이익을 위해 만드는 협동조합을 규정한다.", "평생교육법은 평생학습도시·평생학습마을의 운영 체계를 규정한다.", "한국의 공동체에는 항상 하나의 법령만 적용되며 여러 법령이 동시에 작동하는 경우는 없다."], "ans": 3, "exp": "한국의 공동체에는 한 공간에서 여러 법령이 동시에 작동하는 경우가 흔하다. 같은 동네에서 협동조합·평생학습마을·마을공동체 사업이 함께 이루어지는 경우, 활동가는 여러 법령의 권한·재정·대표성·법인격 차이를 이해할 필요가 있다."}, {"no": 82, "text": "다음 사례에서 사회복지사 N이 공동체 조직화 관점에서 취할 수 있는 가장 적절한 접근은?", "passage": "한 임대아파트 단지에서 고립된 어르신들의 우울과 자살 사례가 반복되고 있다. 단지 내에는 빈 공간이 있고, 어르신들 중 일부는 과거 노동조합 활동, 마을 부녀회 활동, 자영업 경험을 가지고 있다. 단지 외부에는 사회적협동조합과 평생학습관이 있다.", "plabel": "사례", "opts": ["개별 어르신을 대상으로 한 우울증 약물 치료 의뢰에만 집중한다.", "어르신들의 과거 경험을 자원으로 보고, 어르신들과 함께 단지 내 빈 공간 활용을 논의하며, 사회적협동조합·평생학습관과의 연계를 통해 주민 주도의 공동 활동을 조직한다.", "사회복지사 N이 단독으로 프로그램을 설계해 어르신들에게 제공한다.", "어르신의 우울 문제는 개인적 문제이므로 공동체 차원의 개입은 불필요하다."], "ans": 1, "exp": "공동체 조직화 관점은 ① 주민을 변화의 주체로 보고(어르신의 과거 경험을 자산으로 본다), ② 지역의 자산을 함께 본다(빈 공간, 사회적협동조합, 평생학습관), ③ 주민 주도의 활동을 함께 만든다는 원칙에 기초한다. 선지 ①③은 시혜적 접근이고, ④는 개인 차원으로 환원하는 피해자 비난(blame the victim)의 시각이다."}, {"no": 83, "text": "프레이리(Paulo Freire)가 제시한 비판적 의식화(conscientização)의 의미로 가장 적절한 것은?", "passage": null, "plabel": "지문", "opts": ["전문가가 주민에게 올바른 지식을 전달하는 교육 과정", "억압받는 사람이 자신의 현실을 새롭게 읽고 변화의 주체가 되는 과정", "가난한 지역 주민이 권력에 맞서 자기 이익을 조직화하는 전술", "행정기관이 주민 참여를 제도화하는 절차"], "ans": 1, "exp": "프레이리는 「피억압자의 교육학」에서 비판적 의식화를 통해 억압받는 사람이 자신의 현실을 새롭게 읽고 변화의 주체가 되는 과정을 제시했다. ③은 알린스키의 조직화 전략에 가깝다."}, {"no": 84, "text": "협동조합기본법에 따라 협동조합을 설립하기 위해 필요한 최소 발기인 수는?", "passage": null, "plabel": "지문", "opts": ["3인", "7인", "5인", "10인"], "ans": 2, "exp": "협동조합기본법은 협동조합 설립에 5인 이상의 발기인을 요구한다. 법령의 숫자 기준은 개정될 수 있으므로 실제 출제 시점의 현행 조문을 다시 확인해야 한다."}, {"no": 85, "text": "한국 현장에서 공동체 조직가의 KSA 역량 중 태도 영역이 가장 어렵게 다루어지는 이유는?", "passage": null, "plabel": "지문", "opts": ["사회복지사가 주민보다 전문가의 위치에 서기 쉬운 구조 때문이다", "관련 법령이 조직가의 태도를 규정하지 않기 때문이다", "주민들이 공동체 활동 참여를 거부하기 때문이다", "회의 진행과 갈등 조정 기술 교육이 부족하기 때문이다"], "ans": 0, "exp": "한국 현장에서는 사회복지사가 주민보다 전문가의 위치에 서기 쉬운 구조 때문에, 주민을 전문가로 존중하고 자기 권위를 절제하는 태도의 영역이 가장 어렵게 다루어진다."}]}, {"n": 11, "t": "갈등과 조정", "qs": [{"no": 86, "text": "갈등의 주요 유형에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["단일 갈등 — 한 사건에는 한 가지 유형의 갈등만 작동한다", "자원 갈등 — 한정된 자원을 누가 가질 것인가에 관한 갈등", "가치 갈등 — 서로 다른 신념과 가치관이 부딪치는 갈등", "구조 갈등 — 권력·자원·정보가 한쪽으로 치우쳐 발생하는 갈등"], "ans": 0, "exp": "한 갈등 사건에는 자원·가치·관계·구조 갈등이 동시에 작동하는 경우가 많다. 어떤 유형이 우세한지, 어떤 유형이 더 깊이 자리 잡고 있는지를 식별하는 것이 조정의 첫걸음이다."}, {"no": 87, "text": "Lederach가 제시한 갈등의 세 층(three layers)에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["표면의 문제(issue)", "관계(relationship)", "효율(efficiency)", "구조(structure)"], "ans": 2, "exp": "Lederach의 갈등의 세 층은 표면의 문제 — 관계 — 구조이다. 효율은 갈등의 층위가 아니라 일반적인 경영·관리의 평가 기준이다. 표면의 문제만 해결하면 같은 갈등이 모양을 바꿔 반복된다."}, {"no": 88, "text": "회복적 정의(restorative justice)에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["응보적 정의가 처벌에 초점을 둔다면, 회복적 정의는 관계의 회복에 초점을 둔다.", "피해자의 경험과 욕구를 중심에 둔다.", "모든 갈등 상황에서 동일하게 적용할 수 있는 만능 방법이다.", "공동체가 회복 과정에 함께 참여한다."], "ans": 2, "exp": "회복적 정의는 모든 갈등에 적용 가능한 만능 방법이 아니다. 특히 가정폭력·성폭력 등 권력 불균형이 큰 상황에서는 피해자에게 2차 가해를 만들 위험이 있어 신중한 적용이 필요하다."}, {"no": 89, "text": "갈등 조정자의 역할에 관한 설명으로 가장 옳은 것은?", "passage": null, "plabel": "지문", "opts": ["양측의 말을 같은 시간만큼 듣는 기계적 균형만 지키면 된다.", "절차의 공정성을 지키고 권력 불균형을 살피면서 당사자들이 소통하고 합의하도록 돕는다.", "갈등이 드러나지 않도록 논의를 중단시키는 것이 우선이다.", "조정자가 가장 합리적이라고 판단한 해결책을 당사자에게 따르도록 한다."], "ans": 1, "exp": "갈등 조정자는 절차의 공정성을 지키고 당사자들의 소통과 합의를 지원한다. 권력이 비대칭적인 상황에서 기계적 균형은 약자에게 불리할 수 있으므로 참여 조건과 발언 기회도 함께 살펴야 한다."}, {"no": 90, "text": "다음 사례에서 사회복지사 O가 Lederach의 갈등의 세 층 관점에서 살펴야 할 차원이 가장 적절하게 짝지어진 것은?", "passage": "한 임대아파트 단지에서 \"주차장 자리 부족\"을 둘러싼 분쟁이 반복되고 있다. 입주민 회의는 늘 고성으로 끝난다. 단지 안에는 분양동과 임대동이 한 단지에 함께 있으며, 분양동 입주민이 임대동 주민을 부담스러운 이웃으로 여기는 정서가 오래 누적되어 왔다.", "plabel": "사례", "opts": ["표면 — 주차장 자리 부족 / 관계 — 누적된 무시와 불신 / 구조 — 분양·임대 혼합단지의 구조와 사회적 낙인", "표면 — 회의 진행 방법 / 관계 — 주차 비용 / 구조 — 차량 등록제도", "표면 — 분양동의 자산 가치 / 관계 — 임대동의 욕구 / 구조 — 주차장 면적", "표면 — 관리사무소의 행정 / 관계 — 주차 단속 인력 / 구조 — 단지 출입구 설계"], "ans": 0, "exp": "이 사례에서 표면의 문제는 주차장 자리 부족이라는 당장의 사안이지만, 관계 차원에는 분양동과 임대동 입주민 사이에 오래 누적된 무시와 불신이 있다. 그 아래 구조 차원에는 분양·임대 혼합단지라는 정책적 구조와 임대주택 거주민에 대한 사회적 낙인이 자리 잡고 있다. 표면의 주차장 문제만 해결하면 같은 갈등이 다른 모양(예: 놀이터, 엘리베이터, 입주자대표회의)에서 다시 반복된다. 사회복지사는 세 층을 함께 보면서 단기·중기·장기 개입을 함께 설계해야 한다."}, {"no": 91, "text": "응보적 정의(retributive justice)가 던지는 핵심 질문으로 가장 적절한 것은?", "passage": null, "plabel": "지문", "opts": ["누가 어떤 피해를 입었는가", "공동체가 회복 과정에 어떻게 참여할 것인가", "가해자가 자신의 행위가 만든 결과를 어떻게 직면할 것인가", "누가 잘못했고 어떻게 처벌할 것인가"], "ans": 3, "exp": "응보적 정의는 \"누가 잘못했고 어떻게 처벌할 것인가\"를 묻고, 회복적 정의는 \"누가 어떤 피해를 입었고 그것을 어떻게 회복할 것인가\"를 묻는다. ①②③은 회복적 정의의 핵심 원리에 해당한다."}, {"no": 92, "text": "다음 사례에서 가장 두드러진 갈등의 유형은?", "passage": "분양동과 임대동이 섞인 단지에서 입주자대표회의 의결권이 분양동 입주민에게 집중되어 있고, 임대동 주민은 회의 자료와 결정 정보에 접근하기도 어렵다. 임대동 주민들은 단지 운영에서 자신들의 목소리가 구조적으로 배제되어 있다고 느낀다.", "plabel": "사례", "opts": ["구조 갈등", "자원 갈등", "가치 갈등", "관계 갈등"], "ans": 0, "exp": "구조 갈등은 권력·자원·정보가 한쪽으로 치우쳐 있을 때 발생한다. 의결권과 정보 접근이 한쪽에 집중된 이 사례는 구조 갈등이 두드러지는 경우이다."}, {"no": 93, "text": "갈등전환의 관점에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["갈등이 드러나지 않는 상태를 최종 목표로 삼는다.", "표면의 쟁점뿐 아니라 당사자 관계와 갈등을 낳은 구조를 함께 살핀다.", "갈등을 파괴적 사건으로만 보지 않고 변화의 가능성을 드러내는 과정으로 본다.", "단기 합의 이후에도 관계와 구조의 변화를 지속적으로 점검한다."], "ans": 0, "exp": "갈등전환은 갈등을 감추거나 없애는 데 그치지 않고, 표면의 쟁점·당사자 관계·구조적 조건을 함께 변화시키는 접근이다. 갈등을 통해 드러난 문제를 장기적 변화의 계기로 다룬다."}]}, {"n": 12, "t": "디지털 시대의 사회복지실천", "qs": [{"no": 94, "text": "디지털 격차(digital divide)의 세 차원에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["1차 격차는 디지털 기기와 인터넷에 접근할 수 있는지에 관한 차이이다.", "2차 격차는 접근이 가능하더라도 원하는 목적으로 사용할 수 있는지에 관한 차이이다.", "3차 격차는 같은 디지털 환경 안에서도 누가 어떤 결과를 얻는지에 관한 차이이다.", "한국에서는 1차 격차가 줄었기 때문에 디지털 격차 문제는 사실상 해결되었다."], "ans": 3, "exp": "한국에서 1차 격차(접근 격차)는 상당 부분 줄었지만, 2차 격차(활용 격차)와 3차 격차(결과 격차)는 오히려 심화되고 있다. 디지털 격차는 해결된 문제가 아니라 모양을 바꾸어 계속되는 문제이다."}, {"no": 95, "text": "알고리즘 불평등(algorithmic inequality)에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["자동화된 의사결정은 기존의 사회 불평등을 강화하는 방향으로 작동할 수 있다.", "자동화된 복지 자격 심사가 가난한 사람을 더 자주 부정 수급자로 분류하는 경향이 보고되었다.", "알고리즘은 객관적이고 가치 중립적이므로 인간의 편향이 개입할 여지가 없다.", "알고리즘에는 설계자의 가정, 기존 데이터의 편향, 정책의 우선순위가 함께 들어가 있다."], "ans": 2, "exp": "알고리즘은 객관적이고 가치 중립적이라는 통념과 달리, 그 안에는 설계자의 가정·데이터의 편향·정책의 우선순위가 함께 들어가 있다. 유뱅크스의 「자동화된 불평등(Automating Inequality)」은 자동화된 복지 시스템이 가난한 사람을 어떻게 더 자주 배제하는지를 실증적으로 보여준다."}, {"no": 96, "text": "AI·디지털 시대 클라이언트가 겪을 수 있는 어려움에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["키오스크와 온라인 행정 중심 환경은 디지털 비이용 노인을 일상 서비스에서 배제할 수 있다.", "AI 챗봇은 정서적 동반과 진정한 인간관계를 완전히 대체할 수 있다.", "한국어 중심의 디지털 서비스는 이주민에게 언어적 장벽과 반복적 좌절을 만들 수 있다.", "알고리즘 결정은 기존 데이터의 편향을 자동화하고 클라이언트의 이의제기 기회를 약화할 수 있다."], "ans": 1, "exp": "AI 챗봇이 정서적 동반을 제공하는 것처럼 보일 수 있지만 진정한 인간관계를 대신할 수 없다고 본다. 디지털 배제, 언어 장벽, 알고리즘 편향과 이의제기권의 약화는 모두 관련된 위험이다."}, {"no": 97, "text": "알고리즘 거버넌스의 원칙에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["투명성", "설명 가능성", "이의제기 권리", "효율성을 위한 인간의 최종 결정 배제"], "ans": 3, "exp": "알고리즘 거버넌스는 투명성, 설명 가능성, 책무성, 이의제기 권리, 인간의 최종 결정을 요구한다. 알고리즘은 사회복지사의 판단을 보조할 수 있지만 최종 결정을 대신해서는 안 된다."}, {"no": 98, "text": "다음 사례에서 나타난 디지털 격차의 차원으로 가장 적절한 것은?", "passage": "R씨는 스마트폰과 인터넷을 보유하고 있지만 온라인 복지 신청 절차를 이해하기 어렵다. 필요한 서비스를 이용하지 못하면서 경제적 지원에서도 배제되고 있다.", "plabel": "사례", "opts": ["접근 차원만 나타난다.", "활용 차원만 나타난다.", "활용 차원과 결과 차원이 함께 나타난다.", "자발적 비이용만 나타난다."], "ans": 2, "exp": "기기와 인터넷은 보유했지만 절차를 효과적으로 이용하지 못한다는 점은 활용 차원의 격차이다. 그 결과 경제적 지원에서 배제된다는 점은 결과 차원의 격차이다."}, {"no": 99, "text": "다음 사례에서 어르신이 겪고 있는 디지털 격차의 차원으로 가장 적절한 것은?", "passage": "70대 X씨는 스마트폰을 가지고 있고 집에 인터넷도 설치되어 있다. 그러나 복지 신청 앱의 본인 인증과 서류 첨부 절차를 혼자서는 수행할 수 없어 신청을 포기했다.", "plabel": "사례", "opts": ["1차 격차(접근 격차)", "2차 격차(활용 격차)", "3차 격차(결과 격차)", "디지털 격차에 해당하지 않는다"], "ans": 1, "exp": "2차 격차(활용 격차)는 기기와 인터넷에 접근할 수 있더라도 그것을 원하는 목적으로 사용할 수 없는 경우를 말한다. 한국에서는 1차 격차가 줄어든 반면 2차·3차 격차가 심화되고 있다."}, {"no": 100, "text": "디지털 격차의 세 차원 중 디지털 기술의 활용이 가져오는 사회적·경제적·교육적 혜택의 불평등을 가리키는 것은?", "passage": null, "plabel": "지문", "opts": ["접근 차원(access)", "활용 차원(use)", "결과 차원(outcomes)", "자발적 비이용(voluntary non-use)"], "ans": 2, "exp": "디지털 격차를 접근, 활용, 결과의 세 차원으로 구분한다. 같은 기술을 이용하더라도 사회적·경제적·교육적 혜택이 다르게 나타나는 문제는 결과 차원의 격차이다."}, {"no": 101, "text": "유뱅크스(Virginia Eubanks)의 「자동화된 불평등(Automating Inequality)」이 보여준 핵심 내용으로 가장 적절한 것은?", "passage": null, "plabel": "지문", "opts": ["자동화된 복지 자격 심사는 가난한 사람을 더 자주 부정 수급자로 분류하고, 더 자주 거부하며, 더 자주 비가시화한다", "자동화는 인간의 편향을 제거하여 복지 행정의 공정성을 완전히 보장한다", "알고리즘은 설계자의 가정이나 데이터의 편향과 무관하게 작동한다", "디지털 격차는 기기 보급만으로 해결된다"], "ans": 0, "exp": "유뱅크스는 자동화된 복지 자격 심사가 가난한 사람을 더 자주 부정 수급자로 분류하고 거부하며 비가시화함을 보여주었다. 알고리즘에는 설계자의 가정·데이터의 편향·정책의 우선순위가 함께 들어가 있다."}]}, {"n": 13, "t": "근거에 바탕을 둔 실천과 그 한계", "qs": [{"no": 102, "text": "근거에 바탕을 둔 실천(EBP)에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["EBP는 가장 좋은 외부 근거, 실천가의 경험과 전문성, 클라이언트의 가치와 선호를 통합해 실천 결정을 내리는 접근이다.", "EBP는 클라이언트의 가치와 맥락을 고려할 필요 없이 외부 근거만으로 실천을 결정하는 접근이다.", "EBP의 다섯 단계는 질문 형성, 근거 검색, 근거 평가, 적용, 평가와 환류이다.", "EBP는 근거가 없는 관행과 전통과 권위에 의존한 실천을 비판하면서 등장했다."], "ans": 1, "exp": "EBP는 외부 근거만으로 실천을 결정하는 접근이 아니라, 근거 + 실천가의 전문성 + 클라이언트의 가치·선호를 통합하는 접근이다. 외부 근거만 강조하면 EBP의 본래 정의에서 벗어난다."}, {"no": 103, "text": "EBP가 사회복지실천에 가져온 강점에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["무작위 통제 실험(RCT)이 유일한 근거이므로 다른 모든 지식을 폐기할 수 있다.", "자원의 사용과 개입의 효과에 대한 책무성을 강화한다.", "효과 없는 개입이 관행처럼 지속되는 것을 막는다.", "개별 사회복지사의 경험이 공동의 지식으로 축적된다."], "ans": 0, "exp": "EBP가 RCT를 최고의 근거로 위계화하는 경향이 있는 것은 사실이지만, 이를 유일한 근거로 보고 다른 지식을 폐기하는 것은 EBP의 비판 지점이지 강점이 아니다."}, {"no": 104, "text": "EBP에 대한 주요 비판으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["근거의 위계화로 인해 질적 연구·실천 지식·소수자 경험이 근거로 인정받지 못하는 경향이 있다.", "다른 사회·문화적 맥락에서 검증된 개입이 한국 현장에 그대로 옮겨질 때 맥락의 차이가 무시되기 쉽다.", "어떤 연구가 자금을 받고 출판되며 '효과적'으로 인증되는가는 권력관계와 무관하지 않다.", "EBP는 클라이언트의 가치와 자기결정을 고려하므로 어떠한 비판도 받지 않는다."], "ans": 3, "exp": "EBP는 분명한 강점을 가지지만 동시에 근거의 협소함, 맥락의 탈각, 권력의 문제, 클라이언트 다양성의 한계 등 여러 비판이 제기되어 온 접근이다."}, {"no": 105, "text": "다음에서 설명하는 대안적 증거 접근으로 가장 적절한 것은?", "passage": "사회복지 일선 활동에서 누적되는 경험·지식·통찰을 사례 기록의 분석, 결과 평가, 동료 간 경험 공유, 슈퍼비전과 자문을 통해 체계화한다.", "plabel": "지문", "opts": ["연구 증거(research evidence)", "실천 기반 증거(practice-based evidence)", "맥락 기반 증거(context-based evidence)", "당사자 기반 증거(user-led evidence)"], "ans": 1, "exp": "실천 기반 증거는 사회복지 일선 활동에서 누적되는 경험·지식·통찰을 체계화한 증거이다. 사례 기록, 결과 평가, 경험 공유, 슈퍼비전과 동료 자문 등이 형성 과정에 포함된다."}, {"no": 106, "text": "다음 사례에서 사회복지사 R이 EBP의 정신에 가장 부합하게 실천 결정을 내린 것은?", "passage": "사회복지사 R은 학교폭력 피해 학생을 만나고 있다. 외국에서 효과가 검증된 인지행동 기반 단기 프로그램이 보급되어 있다. 그러나 학생은 다문화 배경을 가지고 있고, 프로그램의 일부 언어와 사례가 본인의 경험과 잘 맞지 않는다고 느낀다. 또한 학생은 자조 모임 참여에 강한 관심을 보인다.", "plabel": "사례", "opts": ["외부 근거가 가장 중요하므로 프로그램을 원안 그대로 적용한다.", "학생의 선호만 따라 모든 외부 근거를 무시하고 자조 모임만 활용한다.", "검증된 인지행동 프로그램의 핵심 원리를 활용하되 학생의 문화적 맥락과 자기결정(자조 모임에 대한 관심)을 함께 반영해 맞춤형 개입을 설계하고, 적용 결과를 지속적으로 평가한다.", "EBP는 한국 현장에 부적합하므로 모든 외부 근거를 폐기한다."], "ans": 2, "exp": "EBP의 본래 정신은 외부 근거 + 실천가의 전문성 + 클라이언트의 가치·맥락을 통합하는 것이다. ①은 외부 근거만 강조하는 기계적 적용이고, ②는 근거를 무시한 결정이며, ④는 EBP 전체를 폐기하는 극단적 접근이다. ③은 검증된 원리를 활용하되 맥락에 맞게 적응시키고, 적용 결과를 지속적으로 평가하는 EBP의 가장 균형 잡힌 적용이다."}, {"no": 107, "text": "1990년대 의료 영역에서 근거에 바탕을 둔 실천(EBP)을 정립한 인물은?", "passage": null, "plabel": "지문", "opts": ["Virginia Eubanks", "John Paul Lederach", "Christina Maslach", "David Sackett"], "ans": 3, "exp": "EBP는 1990년대 초 캐나다 McMaster 의과대학의 David Sackett와 동료들에 의해 발달한 뒤 사회복지·교육·정신건강 영역으로 확산되었다. Eubanks는 알고리즘 불평등, Lederach는 갈등전환, Maslach는 소진 연구와 관련된다."}, {"no": 108, "text": "미국·영국에서 효과가 확인된 실천모델이 한국의 사회·문화·제도 환경에서도 같은 효과를 내는지 별도로 검토하는 증거 접근은?", "passage": null, "plabel": "지문", "opts": ["연구 증거(research evidence)", "실천 기반 증거(practice-based evidence)", "맥락 기반 증거(context-based evidence)", "당사자 기반 증거(user-led evidence)"], "ans": 2, "exp": "맥락 기반 증거는 특정 사회·문화·역사·정치적 맥락에서 형성된 지식을 강조한다. 다른 나라나 지역에서 확인된 효과가 한국 또는 다른 지역에서도 동일한지 별도로 검토하는 일이 핵심이다."}, {"no": 109, "text": "EBP의 다섯 단계를 순서대로 옳게 배열한 것은?", "passage": null, "plabel": "지문", "opts": ["근거 검색 → 질문 형성 → 적용 → 근거 평가 → 평가와 환류", "답할 수 있는 질문 형성 → 가장 좋은 근거 검색 → 근거의 질과 적용 가능성 평가 → 클라이언트의 가치·맥락과 통합한 적용 → 적용 결과의 평가와 환류", "적용 → 질문 형성 → 근거 검색 → 근거 평가 → 평가와 환류", "질문 형성 → 적용 → 근거 검색 → 근거 평가 → 평가와 환류"], "ans": 1, "exp": "EBP의 다섯 단계는 ① 답할 수 있는 질문 형성, ② 가장 좋은 근거 검색, ③ 근거의 질과 적용 가능성 평가, ④ 클라이언트의 가치·맥락과 통합한 적용, ⑤ 적용 결과의 평가와 환류이다."}]}, {"n": 14, "t": "사회복지사의 자기돌봄과 오래 일하기", "qs": [{"no": 110, "text": "사회복지사가 마주하는 직업적 스트레스에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["번아웃·대리외상·도덕적 손상은 완전히 같은 개념이므로 구분할 필요가 없다.", "번아웃은 반복되는 업무 스트레스로 인한 신체적·정서적·정신적 소진 상태이다.", "대리외상은 클라이언트의 트라우마 경험을 듣고 다루는 과정에서 사회복지사 자신에게 유사한 외상 증상이 생기는 현상이다.", "도덕적 손상은 옳다고 믿는 일을 제도의 한계로 인해 할 수 없을 때 발생하는 깊은 정서적 상처이다."], "ans": 0, "exp": "번아웃·대리외상·도덕적 손상은 서로 겹치는 부분이 있지만 같은 개념은 아니다. 발생 원인과 대처 방향이 다르므로 구분해서 이해해야 한다."}, {"no": 111, "text": "매슬락(Maslach)이 제시한 번아웃의 세 차원에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["정서적 소진(emotional exhaustion)", "비인격화(depersonalization)", "개인 성취감의 감소(reduced personal accomplishment)", "사회복지사의 도덕적 자질 부족"], "ans": 3, "exp": "매슬락의 번아웃 세 차원은 정서적 소진·비인격화·개인 성취감 감소이다. 사회복지사의 도덕적 자질 부족은 차원에 해당하지 않으며, 오히려 번아웃을 개인의 약점으로 환원하는 잘못된 시각의 예이다."}, {"no": 112, "text": "자기돌봄의 세 차원에 관한 설명으로 옳지 않은 것은?", "passage": null, "plabel": "지문", "opts": ["개인 차원 — 충분한 수면·휴식·운동, 일과 삶의 분리, 정서적 지지망의 유지", "조직 차원 — 적정 업무량, 슈퍼비전 체계, 동료 지지 모임, 휴가의 실질적 사용 보장", "사회구조 차원 — 사회복지사 처우 개선, 적정 인력 배치 기준, 폭력·민원으로부터의 보호", "자기돌봄은 전적으로 사회복지사 개인의 책임이며 조직이나 사회구조의 문제와는 무관하다."], "ans": 3, "exp": "자기돌봄은 개인 차원의 책임만이 아니다. 조직 차원(적정 업무량·슈퍼비전·동료 지지)과 사회구조 차원(처우 개선·인력 기준·안전 체계)이 함께 마련되어야 비로소 가능해진다. 개인의 책임으로만 환원하는 시각은 구조적 문제를 가린다."}, {"no": 113, "text": "한국 사회복지 현장에서 자기돌봄이 구조적으로 어려운 조건에 해당하지 않는 것은?", "passage": null, "plabel": "지문", "opts": ["사회복지사 개인의 의지 부족", "적은 인력으로 많은 사례를 다뤄야 하는 업무 구조", "민원과 폭력에 노출되는 빈도가 높은 일터", "슈퍼비전이 충분하지 않거나 형식적인 경우가 많은 점"], "ans": 0, "exp": "한국 사회복지 현장에서 자기돌봄이 어렵게 다루어지는 것은 사회복지사 개인의 의지 부족 때문이 아니라 일터가 사람을 오래 머물지 못하게 만드는 구조 때문이다."}, {"no": 114, "text": "다음 사례에서 동료 사회복지사 S에게 가장 적절한 조언과 그 근거가 무엇인가?", "passage": "신입 사회복지사 T는 3년차에 접어들면서 \"사례를 만나는 게 두렵고, 모든 클라이언트가 const KEY = 'swpractice-quiz-2026-v1', TKEY = 'swpractice-quiz-theme';
const CIRC = ['①','②','③','④'];
const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

// 상태: id -> {first:'ok'|'bad'|null, solved:bool, wrong:[선택한 오답 인덱스]}
let S = {};
try{ S = JSON.parse(store.get(KEY) || '{}') || {}; }catch(e){ S = {}; }
const all = [];
DATA.forEach(L => L.qs.forEach(q => { q.id = L.n + '-' + q.no; q.lec = L.n; all.push(q); }));
all.forEach(q => { if(!S[q.id]) S[q.id] = {first:null, solved:false, wrong:[]}; });
const save = () => store.set(KEY, JSON.stringify(S));

/* 점수판 접기 */
const FKEY = 'swpractice-quiz-fold';
function setFold(f){
  document.querySelector('.top').classList.toggle('folded', f);
  document.documentElement.classList.toggle('folded', f);
  const b = $('#foldBtn');
  b.textContent = f ? '▼ 펼치기' : '▲ 접기';
  b.title = f ? '점수판 펼치기' : '점수판 접기';
  b.setAttribute('aria-expanded', String(!f));
}
setFold(store.get(FKEY) === '1');
$('#foldBtn').onclick = () => {
  const f = !document.querySelector('.top').classList.contains('folded');
  setFold(f); store.set(FKEY, f ? '1' : '0');
};

/* 테마 */
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $('#themeBtn').textContent = t === 'dark' ? '☀️ 라이트' : '🌙 다크';
}
(function(){
  let t = store.get(TKEY);
  if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  if(store.get(TKEY)) setTheme(t); else $('#themeBtn').textContent = t === 'dark' ? '☀️ 라이트' : '🌙 다크';
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const n = cur === 'dark' ? 'light' : 'dark';
    setTheme(n); store.set(TKEY, n);
  };
})();

/* 렌더링 */
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const lecBox = $('#lectures'), chipBox = $('#chips');
DATA.forEach(L => {
  chipBox.insertAdjacentHTML('beforeend', `<a class="chip" id="chip${L.n}" href="#lec${L.n}">${L.n}강<span></span></a>`);
  const sec = document.createElement('section');
  sec.className = 'lec'; sec.id = 'lec' + L.n;
  sec.innerHTML = `<div class="lec-head"><h2>${L.n}강<small>${esc(L.t)}</small></h2><div class="meta" id="meta${L.n}"></div></div>`;
  L.qs.forEach(q => {
    const d = document.createElement('article');
    d.className = 'q'; d.id = 'q' + q.id;
    d.innerHTML =
      (q.passage ? `<div class="passage"><b>${q.plabel}</b>${esc(q.passage)}</div>` : '') +
      `<p class="qtext"><span class="qno">Q${q.no}</span>${esc(q.text)}</p>` +
      `<ul class="opts">` + q.opts.map((o,i) =>
        `<li><button class="opt" data-q="${q.id}" data-i="${i}"><span class="n">${CIRC[i]}</span><span>${esc(o)}</span></button></li>`).join('') + `</ul>` +
      `<p class="fb" id="fb${q.id}"></p>` +
      `<div class="exp hidden" id="exp${q.id}"><b>해설</b> ${esc(q.exp)}</div>`;
    sec.appendChild(d);
  });
  lecBox.appendChild(sec);
});

function paintQ(q){
  const st = S[q.id], card = $('#q' + q.id);
  card.classList.toggle('solved', st.solved);
  card.querySelectorAll('.opt').forEach(b => {
    const i = +b.dataset.i;
    b.classList.remove('ok','bad','dim');
    b.disabled = false;
    if(st.solved){
      b.disabled = true;
      if(i === q.ans) b.classList.add('ok'); else b.classList.add('dim');
    } else if(st.wrong.includes(i)){
      b.classList.add('bad'); b.disabled = true;
    }
  });
  const fb = $('#fb' + q.id), ex = $('#exp' + q.id);
  ex.classList.toggle('hidden', !st.solved);
  if(st.solved){
    fb.className = 'fb ok';
    fb.textContent = st.first === 'ok' ? '✔ 정답입니다!' : '✔ 정답을 찾았습니다. (첫 선택은 오답이었어요)';
  } else if(st.wrong.length){
    fb.className = 'fb bad';
    fb.textContent = '✘ 오답입니다. 정답을 찾을 때까지 다시 선택해 보세요.';
  } else { fb.className = 'fb'; fb.textContent = ''; }
}

function update(){
  const total = all.length;
  const tried = all.filter(q => S[q.id].first).length;
  const ok = all.filter(q => S[q.id].first === 'ok').length;
  const bad = all.filter(q => S[q.id].first === 'bad').length;
  const pct = total ? Math.round(tried / total * 100) : 0;
  $('#stProg').textContent = tried + '/' + total;
  $('#stProgPct').textContent = pct + '%';
  $('#mini').textContent = `${tried}/${total} · ${Math.round(ok / total * 1000) / 10}점`;
  $('#bar').style.width = pct + '%';
  $('#stScore').textContent = (Math.round(ok / total * 1000) / 10).toString();
  $('#stRate').textContent = tried ? Math.round(ok / tried * 100) + '%' : '-';
  $('#stOk').textContent = ok; $('#stBad').textContent = bad;
  $('#retryWrong').disabled = bad === 0;
  $('#retryWrong').textContent = '오답만 다시풀기' + (bad ? ` (${bad})` : '');

  DATA.forEach(L => {
    const t = L.qs.length;
    const tr = L.qs.filter(q => S[q.id].first).length;
    const sv = L.qs.filter(q => S[q.id].solved).length;
    const okc = L.qs.filter(q => S[q.id].first === 'ok').length;
    const bd = L.qs.filter(q => S[q.id].first === 'bad').length;
    $('#meta' + L.n).textContent = `푼 문제 ${tr}/${t} · 첫 선택 정답 ${okc}`;
    const chip = $('#chip' + L.n);
    chip.classList.toggle('done', tr === t && bd === 0);
    chip.classList.toggle('hasbad', bd > 0);
    chip.querySelector('span').textContent = bd ? `${tr}/${t} · 오답 ${bd}` : `${tr}/${t}`;
  });

  const r = $('#result');
  if(tried === total){
    r.classList.remove('hidden');
    r.innerHTML = `<h3>🎉 모든 문제를 풀었습니다</h3>첫 선택 기준 <b>${ok}/${total}</b> 정답 · 점수 <b>${Math.round(ok/total*1000)/10}점</b> · 정답률 <b>${Math.round(ok/total*100)}%</b>` +
      (bad ? `<br>위의 <b>‘오답만 다시풀기’</b>로 틀린 ${bad}문제를 복습해 보세요.` : '<br>모두 한 번에 맞혔습니다. 훌륭해요!');
  } else r.classList.add('hidden');
}

/* 선택 처리 */
lecBox.addEventListener('click', e => {
  const b = e.target.closest('.opt');
  if(!b || b.disabled) return;
  const q = all.find(x => x.id === b.dataset.q), i = +b.dataset.i, st = S[q.id];
  if(st.solved) return;
  if(i === q.ans){
    st.solved = true;
    if(!st.first) st.first = 'ok';
  } else {
    if(!st.first) st.first = 'bad';
    if(!st.wrong.includes(i)) st.wrong.push(i);
  }
  paintQ(q); update(); save();
});

/* 다시풀기 */
let tt;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }
const reset = q => { S[q.id] = {first:null, solved:false, wrong:[]}; paintQ(q); };
$('#retryWrong').onclick = () => {
  const targets = all.filter(q => S[q.id].first === 'bad');
  if(!targets.length){ toast('다시 풀 오답이 없습니다'); return; }
  targets.forEach(reset); update(); save();
  toast(`오답 ${targets.length}문제를 다시 풀 수 있게 초기화했어요`);
  $('#q' + targets[0].id).scrollIntoView({behavior:'smooth', block:'start'});
};
let armT;
$('#retryAll').onclick = () => {
  const b = $('#retryAll');
  if(!b.classList.contains('warn')){
    b.classList.add('warn'); b.textContent = '한 번 더 누르면 전체 기록 삭제';
    clearTimeout(armT); armT = setTimeout(() => { b.classList.remove('warn'); b.textContent = '전체 다시풀기'; }, 4000);
    return;
  }
  clearTimeout(armT); b.classList.remove('warn'); b.textContent = '전체 다시풀기';
  all.forEach(reset); update(); save();
  window.scrollTo({top:0, behavior:'smooth'});
  toast('전체 문제를 초기화했어요');
};

all.forEach(paintQ); update();
</script>
