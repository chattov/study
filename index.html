<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026-2 기말고사 공부방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 레이아웃: 시간표처럼 생긴 과목 카드 목록. 위에 기말고사 폴더 바로가기, 아래 과목마다 '강의노트 / 문제·정리 / 폴더' 세 줄 */
:root{
  --bg:#eef1f4; --card:#ffffff; --ink:#1b2129; --sub:#5d6773; --line:#d6dce3; --soft:#f5f7f9;
  --accent:#2a5bd7; --accent-soft:#e8eefc; --note:#1f7a55; --note-soft:#e4f4ec; --quiz:#b4471c; --quiz-soft:#fcebe3;
  --f-ui:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-head:"Noto Serif KR","Batang",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --card:#1a1f25; --ink:#e6e9ed; --sub:#9ba5b1; --line:#2c343d; --soft:#20262d;
  --accent:#86a8f5; --accent-soft:#1f2a40; --note:#6fd3a4; --note-soft:#16302a; --quiz:#f0a07c; --quiz-soft:#3a2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --card:#1a1f25; --ink:#e6e9ed; --sub:#9ba5b1; --line:#2c343d; --soft:#20262d;
  --accent:#86a8f5; --accent-soft:#1f2a40; --note:#6fd3a4; --note-soft:#16302a; --quiz:#f0a07c; --quiz-soft:#3a2219; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--sub)}
h1{font-family:var(--f-head);font-weight:900;font-size:30px;margin:2px 0 0;letter-spacing:.02em;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--sub);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1420}}

/* 과목 바로가기 */
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.jump a{display:block;text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.jump a:hover{border-color:var(--accent);color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:16px}
.subj-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.subj-h h2{margin:0;font-family:var(--f-head);font-size:20px;font-weight:900;letter-spacing:.02em;min-width:0}
.subj-h .st{font-size:12px;color:var(--sub);white-space:nowrap}
.row{display:grid;grid-template-columns:4.2em 1fr;gap:8px;align-items:start}
.tag{font-size:12px;font-weight:700;text-align:center;border-radius:6px;padding:3px 0;margin-top:2px}
.tag.n{background:var(--note-soft);color:var(--note)}
.tag.q{background:var(--quiz-soft);color:var(--quiz)}
.tag.f{background:var(--soft);color:var(--sub)}
.links{display:flex;flex-direction:column;gap:4px;min-width:0}
.lk{display:flex;align-items:baseline;gap:8px;text-decoration:none;padding:4px 8px;border-radius:7px;min-width:0}
.lk:hover{background:var(--soft)}
.lk .t{min-width:0;overflow-wrap:anywhere;font-weight:600}
.lk:hover .t{text-decoration:underline}
.lk .k{flex:none;font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:1.6}
.lk.main .t{color:var(--accent)}
.lk.web .k{color:var(--quiz);border-color:var(--quiz)}
.none{font-size:13px;color:var(--sub);padding:4px 8px}
.memo{font-size:12.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px;margin:0}

footer{margin-top:22px;font-size:13px;color:var(--sub);line-height:1.7}
footer b{color:var(--ink)}
@media (max-width:520px){h1{font-size:24px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">방송통신대 사회복지학과 · 2026학년도 2학기</div>
      <h1>기말고사 공부방</h1>
      <p class="lead">과목별 강의노트와 문제 파일을 한 곳에 모았습니다. 링크는 새 탭에서 열립니다.</p>
    </div>
    <div class="tools">
      <a class="btn primary" href="https://drive.google.com/drive/folders/1qzLI6rcch5Cji5fq7qGszupHu-ZfcKry" target="_blank" rel="noopener">기말고사 폴더 열기</a>
      <a class="btn" href="https://drive.google.com/drive/folders/1spz2y9_Q7RL7sbBbQwYhcez-fTcAveqm" target="_blank" rel="noopener">!2026KNOU 폴더</a>
      <button class="btn" id="themeBtn" type="button">다크</button>
    </div>
  </header>

  <ul class="jump" id="jump" aria-label="과목 바로가기"></ul>
  <div class="grid" id="grid"></div>

  <footer>
    <b>표시 안내</b> — <b>문서</b>는 구글 문서, <b>PDF·HWP·DOCX</b>는 드라이브 파일, <b>웹</b>은 Claude에서 바로 풀 수 있는 페이지입니다.
    <b>HTML</b>은 드라이브에서 내려받아 브라우저로 여는 파일입니다. 파란 글씨가 최신 통합본입니다.
  </footer>
</div>

<script>
const D = 'https://docs.google.com/document/d/', F = 'https://drive.google.com/file/d/', FO = 'https://drive.google.com/drive/folders/';
const SUBJ = [
  {id:'practice', name:'사회복지실천론', st:'노트 1~14강',
    notes:[
      {t:'사회복지실천론 강의노트 (1~14강)', k:'문서', u:D+'1LQ1GR-gW8YdLF-ZmIgNR2-XU0kyNnaEkhtORd0pB0C0/edit', main:1},
      {t:'사회복지실천론 강의노트 (1~14강)', k:'PDF', u:F+'1bTVLvkel1YSLggkzOoX4luRtV_uCvhSu/view'}],
    quiz:[
      {t:'모의시험지 (125문항, 한꺼번에 채점)', k:'웹', u:'https://claude.ai/artifact/KFxi3kpkJdPoTfHPxGRy9w', web:1, main:1},
      {t:'연습문제 (문항별 즉시 채점)', k:'웹', u:'https://claude.ai/artifact/ETjrVikUoxisXZEWW87fpZ', web:1},
      {t:'기말고사 준비자료 (문제·정답 분리)', k:'PDF', u:F+'1te_nyWqghM7SjXG4IaSdaEICsJ6agOd1/view'},
      {t:'기말고사 준비자료 (원본)', k:'PDF', u:F+'17nmEDQ7K8sugONwttRLr5K8sEejfOGnq/view'},
      {t:'모의시험지 / 연습문제', k:'HTML', u:FO+'1qzLI6rcch5Cji5fq7qGszupHu-ZfcKry'}],
    folder:FO+'1pBoQ_QzsO1e0BJAkwP5i7JzPQwa0E0qa',
    memo:'강의노트의 6️⃣ 표시는 기말고사 준비자료에 출제된 부분입니다.'},
  {id:'case', name:'사례관리론', st:'노트 1~15강',
    notes:[
      {t:'사례관리론 01-15강 강의노트', k:'문서', u:D+'1sMdIIhySWS8N1cVvVVoE7K6cb8ZgQfXMObS_ifqjmbM/edit', main:1},
      {t:'사례관리론 강의노트 (이전 본)', k:'문서', u:D+'1K_fuFjNC6OHB4tE7aLX6jP96zzxPUBlspSuRUGzkbPE/edit'}],
    quiz:[
      {t:'2025 기말 연습문제 (수정)', k:'PDF', u:F+'1KiUrJAjkaGGjyp9AhljrBrtBN5nebjEv/view', main:1},
      {t:'2025 기말 연습문제', k:'PDF', u:F+'1M19wfAj6-mjHjWu8e3Yj4rWKK-bWEcSp/view'},
      {t:'사례관리론 연습문제', k:'HWP', u:F+'1ovP5Cp3OGGw73ugGVoHcZ2oGL6yt-du0/view'}],
    folder:FO+'1EhlbPdauflvlhl82ktjQKaLrDXp64UIe'},
  {id:'policy', name:'사회복지정책론', st:'노트 1~15강',
    notes:[
      {t:'사회복지정책론 강의노트 (1~15강)', k:'문서', u:D+'1isALNlGBAUlsx2UUieF-R_KfiLJ90k1MWfIphwfd-io/edit', main:1}],
    quiz:[], folder:FO+'1lKkF5lYlXcBBdAx1H_jYiMDBB2XwfETc'},
  {id:'elder', name:'노인복지론', st:'노트 1~15강',
    notes:[
      {t:'노인복지론 강의노트 (1~15강)', k:'문서', u:D+'1uq5FYqF5dcKM1rijwAJI2ZMzScSlZSS_8xm2jIdKZ3s/edit', main:1}],
    quiz:[
      {t:'노인복지론 정리요약', k:'PDF', u:F+'1gjwK96UHxPIHcETASXv5Yo1QQyW36jEK/view'}],
    folder:FO+'1cw9I2qiAuSMXM9XkqLr7lFJsxVdgKMVv'},
  {id:'community', name:'지역사회복지론', st:'노트 1~10강 + 11~15강 따로',
    notes:[
      {t:'지역사회복지론 강의노트', k:'문서', u:D+'1INfefj9xdx6XRZH0ychx05oadKu-SPst_4al6etiFdI/edit', main:1},
      {t:'11~15강 강의노트 (강별 파일)', k:'폴더', u:FO+'15mnyCOmBEbmTXm_9_C87Peokzkhby5y2'}],
    quiz:[], folder:FO+'1vPAnTjvkWBkHlLO2mytxbfv3oND-z6jN'},
  {id:'research', name:'사회복지조사론', st:'노트 1~6강',
    notes:[
      {t:'사회복지조사론 강의노트', k:'문서', u:D+'1jqXwUqNwnWUWiAqW3LoEpPzaDRjXL0uzA6yPBCyU06Q/edit', main:1},
      {t:'강의노트 폴더', k:'폴더', u:FO+'1ssSgkGgK-XmZVKWT7n2Qorq2z5o30Jig'}],
    quiz:[
      {t:'교수님 정리하기 (1~15)', k:'PDF', u:F+'1dbJjlF6oM0lUC7g7_wnE4dANRXIobWfC/view', main:1},
      {t:'용어정리', k:'PDF', u:F+'1Dh6mB1tH3IMMhtMIg4vgIwnHahAb4ZAx/view'}],
    folder:FO+'1qxEZ1frTDUlOYHcCYrygyjlxrfrnq_lB'},
  {id:'hbse', name:'인간행동과 사회환경', st:'노트 1~6강 + 7~12강 따로',
    notes:[
      {t:'인간행동과 인간발달 강의노트', k:'문서', u:D+'1FsOd_kd1c9eVoSCuHR5teR7o_Zh1wheVropjGg6RWEw/edit', main:1},
      {t:'1~12강 강의노트 (강별 파일)', k:'폴더', u:FO+'1YncVQfNFw0ji3_5vuEx7iPWmY3-wR_cq'}],
    quiz:[
      {t:'2026인행사 (2-1 해설 수정)', k:'HTML', u:F+'1ESRaD2UX6ctlvoHMMj5ox8ffysJdU854/view', main:1},
      {t:'2026인행사', k:'HTML', u:F+'12cU0viHzrOKP479_lhggO_0Gm1bb4-Pg/view'}],
    folder:FO+'1XUj0UNZMBzHAeBPQnf6KLd8Au8gV5lvM'}
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lk = x => `<a class="lk${x.main?' main':''}${x.web?' web':''}" href="${x.u}" target="_blank" rel="noopener"><span class="k">${x.k}</span><span class="t">${esc(x.t)}</span></a>`;
document.getElementById('jump').innerHTML = SUBJ.map(s => `<li><a href="#${s.id}">${esc(s.name)}</a></li>`).join('');
document.getElementById('grid').innerHTML = SUBJ.map(s => `
  <section class="subj" id="${s.id}">
    <div class="subj-h"><h2>${esc(s.name)}</h2><span class="st">${esc(s.st)}</span></div>
    <div class="row"><span class="tag n">강의노트</span><div class="links">${s.notes.map(lk).join('')}</div></div>
    <div class="row"><span class="tag q">문제·정리</span><div class="links">${s.quiz.length ? s.quiz.map(lk).join('') : '<span class="none">아직 없음</span>'}</div></div>
    <div class="row"><span class="tag f">폴더</span><div class="links">${lk({t:'과목 폴더 열기', k:'폴더', u:s.folder})}</div></div>
    ${s.memo ? `<p class="memo">${esc(s.memo)}</p>` : ''}
  </section>`).join('');
document.querySelectorAll('.jump a').forEach(a => a.addEventListener('click', e => {
  const el = document.querySelector(a.getAttribute('href')); if(!el) return; e.preventDefault(); el.scrollIntoView({block:'start'});
}));

/* 테마 */
const TK = 'exam-hub-theme';
const sget = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const sset = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const cur = () => document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const paint = () => { document.getElementById('themeBtn').textContent = cur() === 'dark' ? '라이트' : '다크'; };
(() => { const t = sget(TK); if(t) document.documentElement.setAttribute('data-theme', t); paint(); })();
document.getElementById('themeBtn').onclick = () => { const n = cur() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); sset(TK, n); paint(); };
</script>

</body>
</html>
